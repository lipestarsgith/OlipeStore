<style>
:root{--bg:#03070f;--panel:#0a1426;--panel2:#0d1b33;--line:#1b4fa8;--sky:#4cc9ff;--neon:#2f7bff;--cream:#f4ead2;--txt:#eef6ff;--mut:#8fb0d6;--red:#ff5c5c;--star:#ffc928;--glow:0 0 6px #2f7bffaa,0 0 16px #2f7bff44}
*{box-sizing:border-box}
body{margin:0;color:var(--txt);font-family:Sora,system-ui,sans-serif;line-height:1.5;background:repeating-linear-gradient(115deg,transparent 0 46px,#f4ead20b 46px 50px),radial-gradient(circle at 70% -10%,#0f3a7a 0,var(--bg) 55%);background-attachment:fixed}
body::after{content:"";position:fixed;inset:6px;border:2px solid var(--neon);border-radius:14px;box-shadow:inset 0 0 14px #2f7bff88,0 0 14px #2f7bff88;pointer-events:none;z-index:30}
a{color:inherit}button,input,textarea,select{font:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:12px 5vw;border-bottom:2px solid var(--neon);box-shadow:0 4px 18px #2f7bff55;position:sticky;top:0;background:#03070fee;backdrop-filter:blur(8px);z-index:5;flex-wrap:wrap}
header::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:4px;background:repeating-linear-gradient(115deg,var(--cream) 0 14px,transparent 14px 28px);opacity:.35}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.3rem;cursor:pointer;margin-right:auto}.brand img{border-radius:50%}.brand b{color:var(--sky)}
.hi{color:var(--mut);font-size:.9rem}
.btn{border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--panel);color:var(--txt);border:1px solid var(--line)}
.btn:hover{border-color:var(--sky)}.btn.pri{background:var(--sky);color:#00263d;border-color:var(--sky)}.btn.ok{background:#1a8f4d;border-color:#1a8f4d}.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}.sm{padding:6px 12px;font-size:.85rem}
main{padding:24px 5vw 50px;max-width:1200px;margin:auto}
h1{font-size:clamp(1.6rem,3.6vw,2.5rem);margin:0 0 6px;line-height:1.15}h2{margin:0 0 12px}h3{margin:18px 0 8px}
.sub{color:var(--mut);margin:0 0 20px}
.hero{border:1px solid var(--neon);box-shadow:var(--glow);border-radius:18px;padding:24px;margin-bottom:22px;background:repeating-linear-gradient(115deg,#f4ead20d 0 18px,transparent 18px 44px),linear-gradient(135deg,#0b2a5c,#050c1c)}
.badges{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:.85rem;color:var(--cream)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.bar input{flex:1;min-width:220px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:99px;padding:8px 16px;cursor:pointer}.chip.on{background:var(--sky);color:#00263d;border-color:var(--sky);box-shadow:var(--glow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--neon);box-shadow:var(--glow);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card:hover{border-color:var(--sky)}
.ph{position:relative}.card img{width:100%;aspect-ratio:16/10;object-fit:cover;background:#02050c;display:block}
.cnt{position:absolute;right:8px;bottom:8px;background:#000a;border-radius:99px;padding:2px 10px;font-size:.75rem}
.card .in{padding:12px 14px;display:flex;flex-direction:column;gap:5px;flex:1;font-size:.92rem}
.price{font-size:1.25rem;font-weight:800;color:var(--sky)}.old{text-decoration:line-through;color:var(--mut);font-size:.9rem;margin-right:8px;font-weight:400}
.stars{color:var(--star);letter-spacing:1px}.stars small,small{color:var(--mut);letter-spacing:0}
.tag{display:inline-block;font-size:.72rem;padding:2px 10px;border-radius:99px;background:var(--line)}
.tag.available{background:#0f6b8f}.tag.sold{background:var(--red)}.tag.reserved,.tag.pending{background:#8a6d00}.tag.paid{background:#176f9c}.tag.delivered{background:#1a8f4d}.tag.cancelled{background:#555}
.modal,.lb{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-start;justify-content:center;padding:4vh 3vw;overflow:auto;z-index:20}
.box{background:var(--bg);border:1px solid var(--neon);box-shadow:var(--glow);border-radius:16px;padding:22px;width:min(760px,100%);position:relative}
.x{position:absolute;right:12px;top:10px;z-index:2}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
input,textarea,select{width:100%;background:#02050c;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,textarea:focus,select:focus{border-color:var(--neon);box-shadow:var(--glow)}
.gal{display:flex;gap:8px;overflow-x:auto;margin:12px 0}.gal img{height:130px;border-radius:10px;cursor:zoom-in;border:1px solid var(--line)}
.lb{z-index:40;align-items:center;background:#000d}.lb img{max-width:min(94vw,1100px);max-height:86vh;border-radius:10px}.lb .cnt{position:fixed;bottom:18px;right:50%;transform:translateX(50%)}
.nav{position:fixed;top:50%;font-size:1.6rem;padding:6px 16px}.nav.l{left:14px}.nav.r{right:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pix{background:#02050c;border:1px dashed var(--sky);border-radius:12px;padding:14px;word-break:break-all;font-weight:600;margin:10px 0}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.9rem}
.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs .btn.on{background:var(--sky);color:#00263d}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--sky);color:#00263d;padding:10px 18px;border-radius:10px;font-weight:600;z-index:50}
.err{color:#ff9d9d;font-size:.9rem;margin-top:8px}.empty{color:var(--mut);padding:30px 0}
.chat{height:min(50vh,400px);overflow:auto;background:#02050c;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;background:var(--panel2);border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:8px 12px;align-self:flex-start;word-break:break-word;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:#0e3a78;border-color:var(--neon);border-radius:12px 12px 3px 12px}
.msg small{display:block;font-size:.7rem;margin-bottom:2px}.msg img{max-width:100%;max-height:220px;border-radius:8px;display:block;margin:4px 0}
.sp{display:flex;gap:2px;margin:6px 0}.sp button{background:none;border:0;font-size:1.8rem;color:#2b3f63;cursor:pointer;padding:0 2px}.sp button.on{color:var(--star)}
.rev{border-top:1px solid var(--line);padding:10px 0}
.pf{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.th{position:relative}.th img{height:70px;border-radius:8px;display:block}.th button{position:absolute;top:2px;right:2px;padding:0 8px}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:0 5vw 28px}
.vipb{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 10px;border-radius:99px;background:linear-gradient(135deg,#ffc928,#ff9d00);color:#2b1c00}.box-vip{border:1px solid var(--star);border-radius:12px;padding:12px 14px;margin:0 0 16px;background:#ffc92812}.ok-t{color:#6ee7a0;font-size:.9rem}
.av{width:var(--s,36px);height:var(--s,36px);border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--neon);background:var(--panel2);vertical-align:middle;margin-right:6px}span.av{display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#00263d;background:linear-gradient(135deg,var(--sky),var(--neon));font-size:calc(var(--s,36px)*.45)}
.me-chip{display:inline-flex;align-items:center;gap:4px;cursor:pointer;background:none;border:0;color:var(--mut);padding:0;font-size:.9rem}.me-chip:hover{color:var(--sky)}.me-chip .av{margin-right:4px}
.pf-card{max-width:460px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--glow)}.pf-card .pf-av{text-align:center;margin-bottom:12px}.pf-card .pf-av .av{margin:0;border-width:3px}.pf-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.msg small .av{margin-right:4px}
.tag-chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.7rem;font-weight:800;margin-left:5px;vertical-align:middle;line-height:1.5;white-space:nowrap}
.pl{cursor:pointer}.pl:hover{text-decoration:underline}
#pfm.modal{z-index:90}
.urow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding:10px 0}.urow .av{margin:0}
.storerate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px}.storerate .stars{font-size:1.6rem}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.hero{padding:16px}}
</style>
</head>

<script>
// ====== CONFIGURE AQUI ======
const CONFIG = {
  SUPABASE_URL: "https://wchogaofyqheurhnswah.supabase.co",
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjaG9nYW9meXFoZXVyaG5zd2FoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5NTMzMDUsImV4cCI6MjEwODUyOTMwNX0.kdyRRdfq8gMNcLbqZsgCiY4KsYN6MXlf3ikFbzfPD60",
  PIX_KEY: "felipegynlopess@gmail.com",
  PIX_NAME: "Tais De Fatima",
  WHATSAPP: "5562999265922" // só números, com 55 + DDD
};
// ============================

const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl = n => Number(n).toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const stars = n => { n = Math.round(n); return "★".repeat(n) + "☆".repeat(5 - n); };
const ST = {available:"Disponível", reserved:"Reservada", sold:"Vendida", pending:"Aguardando pagamento", paid:"Pago – entrega em andamento", delivered:"Entregue", cancelled:"Cancelado"};
const CATS = ["Contas", "Frutas", "Outros"];
let user = null, admin = false, owner = false, manager = false, mod = false, me = {name:"", vip:false, avatar:"", bio:"", tags:[]}, products = [], rv = {}, view = "home", tab = "orders", q = "", cat = "Todas";
let CH = null, chatT = null, LB = {a:[], i:0}, RS = 5, PF = [];
const staff = () => admin || mod;
const amt = (o, p) => o.amount != null ? brl(o.amount) : (p ? brl(p.price) : "");

function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.append(t); setTimeout(()=>t.remove(),2800); }
function modal(html){ clearInterval(chatT); $("#layer").innerHTML = `<div class="modal" onclick="if(event.target===this)closeM()"><div class="box"><button class="btn sm x" onclick="closeM()" aria-label="Fechar">Fechar</button>${html}</div></div>`; }
function closeM(){ clearInterval(chatT); CH = null; $("#layer").innerHTML = ""; }
function go(v){ view = v; closeM(); render(); window.scrollTo(0,0); }
const priceH = p => `<div class="price">${p.old_price ? `<span class="old">${brl(p.old_price)}</span>` : ""}${brl(p.price)}</div>`;
const rating = id => { const a = rv[id] || []; return a.length ? {avg:a.reduce((s,x)=>s+x,0)/a.length, n:a.length} : null; };

/* ---------- Tags, cargos e perfil público ---------- */
const tagTxt = hex => { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; return (0.299*r + 0.587*g + 0.114*b) > 150 ? "#101010" : "#ffffff"; };
const tagH = t => { const c = /^#[0-9a-f]{6}$/i.test(t?.color || "") ? t.color : "#2f7bff"; return `<span class="tag-chip" style="background:${c};color:${tagTxt(c)}">${esc(t?.name)}</span>`; };
const tagsH = a => (a || []).map(tagH).join("");
const roleH = r => { const l = {owner:"Dono", manager:"Gerente", mod:"Moderador"}[r]; return l ? `<span class="vipb" style="background:linear-gradient(135deg,#4cc9ff,#2f7bff);color:#00263d;margin-left:5px">${l}</span>` : ""; };
const vipH = v => v ? `<span class="vipb" style="margin-left:5px">⭐ VIP</span>` : "";
async function loadMyTags(){
  try { const { data } = await sb.rpc("public_profiles", {p_ids:[user.id]}); me.tags = data?.[0]?.tags || []; } catch (e) { me.tags = []; }
}
async function openProfile(id){
  if (!id) return;
  const { data, error } = await sb.rpc("public_profile", {p_id:id});
  if (error) return toast("Perfil indisponível: " + error.message);
  if (!data) return toast("Perfil não encontrado.");
  closePF();
  const since = data.since ? new Date(data.since).toLocaleDateString("pt-BR", {month:"long", year:"numeric"}) : "";
  document.body.insertAdjacentHTML("beforeend", `<div class="modal" id="pfm" onclick="if(event.target===this)closePF()"><div class="box" style="max-width:420px;text-align:center">
    <button class="btn sm x" onclick="closePF()" aria-label="Fechar">Fechar</button>
    <div class="pf-av" style="margin-top:8px">${avatar(data.avatar_url, data.name, 100)}</div>
    <h2 style="margin:0 0 6px">${esc(data.name)}</h2>
    <div class="pf-tags" style="margin-top:0">${roleH(data.role)}${vipH(data.vip)}${tagsH(data.tags)}</div>
    ${data.bio ? `<p style="white-space:pre-wrap;margin:14px 0;word-break:break-word">${esc(data.bio)}</p>` : `<p class="sub" style="margin:14px 0">Esta pessoa ainda não escreveu uma bio.</p>`}
    <p class="sub" style="font-size:.85rem;margin:0">${since ? `Membro desde ${esc(since)} • ` : ""}${data.reviews} ${data.reviews === 1 ? "avaliação" : "avaliações"}</p>
    ${user && user.id === id ? `<div class="row" style="justify-content:center;margin-top:14px"><button class="btn sm pri" onclick="closePF();go('profile')">Editar meu perfil</button></div>` : ""}
  </div></div>`);
}
function closePF(){ $("#pfm")?.remove(); }

/* ---------- Perfil: foto, nome e cache de perfis públicos ---------- */
const PFC = {}; let pfOff = false;
const initial = n => (String(n || "?").trim()[0] || "?").toUpperCase();
function avatar(url, name, size = 36){
  return url ? `<img class="av" style="--s:${size}px" src="${esc(url)}" alt="" loading="lazy">` : `<span class="av" style="--s:${size}px" aria-hidden="true">${esc(initial(name))}</span>`;
}
function resetPF(){ Object.keys(PFC).forEach(k => delete PFC[k]); }
async function loadProfiles(ids){
  const need = [...new Set((ids || []).filter(Boolean))].filter(i => !(i in PFC));
  if (!need.length || pfOff) return;
  const { data, error } = await sb.rpc("public_profiles", {p_ids:need});
  if (error){ pfOff = true; console.warn("public_profiles indisponível (rode o atualizacao_v5.sql):", error.message); return; }
  need.forEach(i => PFC[i] = null); (data || []).forEach(x => PFC[x.id] = x);
}
function msgWho(m, mine){
  const pr = PFC[m.sender];
  const nm = mine ? me.name : (pr?.name || m.sender_name || "Vendedor");
  const label = mine ? "Você" : pr?.role ? esc(m.sender_name || "Equipe") + (pr.name && pr.name !== m.sender_name ? " · " + esc(pr.name) : "") : esc(nm);
  return `<span class="pl" onclick="openProfile('${m.sender}')" title="Ver perfil">${avatar(mine ? me.avatar : pr?.avatar_url, nm, 20)}${label}</span>${tagsH(mine ? me.tags : pr?.tags)}`;
}
function toAvatarBlob(file, size = 320){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement("canvas"), x = c.getContext("2d");
      c.width = c.height = size; x.fillStyle = "#0d1b33"; x.fillRect(0, 0, size, size);
      x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error("Não foi possível processar a imagem.")), "image/jpeg", .88);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Formato não suportado. Use uma foto JPG ou PNG.")); };
    img.src = url;
  });
}
function profileView(){
  if (!user){ go("home"); return; }
  const tags = [owner ? "Dono" : "", manager ? "Gerente" : "", mod ? "Moderador" : ""].filter(Boolean).map(t => `<span class="vipb" style="background:linear-gradient(135deg,#4cc9ff,#2f7bff);color:#00263d">${t}</span>`).join("") + (me.vip ? `<span class="vipb">⭐ VIP</span>` : "") + tagsH(me.tags);
  $("#app").innerHTML = `<h1>Meu perfil</h1><p class="sub">Seu nome e sua foto aparecem para todos: no chat, nas avaliações e no painel da loja.</p>
  <div class="pf-card">
    <div class="pf-av">${avatar(me.avatar, me.name, 112)}</div>
    <div class="row" style="justify-content:center"><label class="btn sm pri" style="margin:0;cursor:pointer;color:#00263d">📷 ${me.avatar ? "Trocar foto" : "Escolher foto"}<input id="pf_f" type="file" accept="image/*" hidden onchange="pickAvatar(this)"></label>${me.avatar ? `<button class="btn sm red" onclick="removeAvatar()">Remover foto</button>` : ""}</div>
    <label for="pf_n">Nome de exibição</label>
    <input id="pf_n" maxlength="40" value="${esc(me.name)}" placeholder="Como você quer ser chamado" onkeydown="if(event.key==='Enter')saveProfile()">
    <label for="pf_b">Bio • <span id="pf_bc">${(me.bio || "").length}</span>/200</label>
    <textarea id="pf_b" rows="3" maxlength="200" placeholder="Escreva uma frase sobre você..." oninput="$('#pf_bc').textContent=this.value.length">${esc(me.bio)}</textarea>
    <label for="pf_e">E-mail (só você vê)</label>
    <input id="pf_e" value="${esc(user.email)}" disabled>
    ${tags ? `<div class="pf-tags">${tags}</div>` : ""}
    <div id="msg" class="err"></div>
    <div class="row" style="margin-top:14px"><button class="btn pri" onclick="saveProfile()">Salvar perfil</button><button class="btn" onclick="openProfile('${user.id}')">👁 Ver como os outros veem</button><button class="btn" onclick="go('home')">Voltar à loja</button></div>
  </div>`;
}
async function saveProfile(){
  const name = $("#pf_n").value.trim(), bio = $("#pf_b").value.trim();
  if (!name){ $("#msg").textContent = "Digite um nome."; return; }
  const { error } = await sb.rpc("update_my_profile", {p_name:name, p_bio:bio});
  if (error){ $("#msg").textContent = error.message; return; }
  me.name = name.slice(0, 40); me.bio = bio.slice(0, 200); delete PFC[user.id]; render(); toast("Perfil salvo");
}
async function pickAvatar(inp){
  const f = inp.files[0]; inp.value = ""; if (!f) return;
  if (!f.type.startsWith("image/")) return toast("Escolha um arquivo de imagem.");
  if (f.size > 15 * 1024 * 1024) return toast("Imagem muito grande (máximo 15 MB).");
  toast("Enviando foto...");
  try {
    const blob = await toAvatarBlob(f), path = `${user.id}/${Date.now()}.jpg`;
    const { error } = await sb.storage.from("avatars").upload(path, blob, {contentType:"image/jpeg", cacheControl:"3600"});
    if (error) throw error;
    const url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
    const { error:e2 } = await sb.rpc("update_my_profile", {p_avatar:url});
    if (e2) throw e2;
    me.avatar = url; delete PFC[user.id]; cleanOldAvatars(path);
    const dn = $("#pf_n")?.value, db = $("#pf_b")?.value; render(); if ($("#pf_n") && dn != null) $("#pf_n").value = dn; if ($("#pf_b") && db != null) $("#pf_b").value = db;
    toast("Foto atualizada");
  } catch (e) { toast(e.message || "Erro ao enviar a foto"); }
}
async function cleanOldAvatars(keep){
  try {
    const { data } = await sb.storage.from("avatars").list(user.id);
    const old = (data || []).map(o => `${user.id}/${o.name}`).filter(x => x !== keep);
    if (old.length) await sb.storage.from("avatars").remove(old);
  } catch (e) {}
}
async function removeAvatar(){
  const { error } = await sb.rpc("update_my_profile", {p_avatar:""});
  if (error) return toast(error.message);
  me.avatar = ""; delete PFC[user.id]; cleanOldAvatars("");
  const dn = $("#pf_n")?.value, db = $("#pf_b")?.value; render(); if ($("#pf_n") && dn != null) $("#pf_n").value = dn; if ($("#pf_b") && db != null) $("#pf_b").value = db;
  toast("Foto removida");
}

async function init(){

  sb.auth.onAuthStateChange((event, s) => { if (["SIGNED_IN","SIGNED_OUT","USER_UPDATED"].includes(event)) setTimeout(() => setUser(s?.user), 0); });
  let u = null;
  try { const { data:{ session } } = await sb.auth.getSession(); u = session?.user; } catch (e) { console.error(e); }

}
async function setUser(u){
  user = u || null; admin = false; owner = false; manager = false; mod = false; me = {name:"", vip:false, avatar:"", bio:"", tags:[]};
  try {
    if (user){
      const { data } = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
      owner = !!data?.is_admin; manager = !!data?.is_manager; admin = owner || manager; mod = !!data?.is_mod; me.vip = !!data?.vip; me.avatar = data?.avatar_url || ""; me.bio = data?.bio || ""; me.name = data?.name || "";
      const meta = user.user_metadata?.name;
      if (!me.name && meta){ me.name = meta; sb.rpc("set_my_name", {p_name: meta}); }
      if (!me.name) me.name = user.email.split("@")[0];
      await loadMyTags();
    }
    await loadProducts();
  } catch (e) { console.error(e); }
  if (!user && ["orders","admin","profile"].includes(view)) view = "home";

}
async function loadProducts(){

}

  return `<div class="storerate" title="Média de todas as avaliações dos clientes"><span class="stars">${stars(avg)}</span> <b>${avg.toFixed(1)}</b> <small>• ${all.length} ${all.length === 1 ? "avaliação" : "avaliações"} de clientes</small></div>`;
}
function featuredH(){
  const a = products.filter(p => p.featured && p.status === "available" && p.stock > 0);

  return `<section id="feat" ${q || cat !== "Todas" ? "hidden" : ""} style="margin-bottom:22px"><h2>⭐ Recomendados</h2><div class="grid">${a.map(card).join("")}</div></section>`;

function list(){

async function quote(id, silent){
  const el = $("#qt"); if (!el) return;
  if (!user){ if (!silent){ el.className = "err"; el.textContent = "Entre na sua conta para usar cupom."; } return; }

  if (!$("#qt")) return;
  if (error || !data || data.error){ if (silent && !data?.error) return; el.className = "err"; el.textContent = error?.message || data?.error || "Erro ao calcular."; return; }
  el.className = "ok-t";
  el.innerHTML = data.discount > 0 ? `✔ ${esc(data.label)}: −${brl(data.discount)} • <b>Você paga ${brl(data.amount)}</b>${data.note ? `<br><small>${esc(data.note)}</small>` : ""}` : "";
}
function lb(id, i){ LB = {a:products.find(x => x.id === id).images, i}; showLB(); }
function lbGo(d){ LB.i = (LB.i + d + LB.a.length) % LB.a.length; showLB(); }
function closeLB(){ $("#lbx").innerHTML = ""; }
function showLB(){ $("#lbx").innerHTML = `<div class="lb" onclick="if(event.target===this)closeLB()"><button class="btn sm x" onclick="closeLB()">Fechar</button>${LB.a.length>1 ? `<button class="btn nav l" onclick="lbGo(-1)" aria-label="Foto anterior">‹</button><button class="btn nav r" onclick="lbGo(1)" aria-label="Próxima foto">›</button>` : ""}<img src="${esc(LB.a[LB.i])}" alt=""><span class="cnt">${LB.i+1} / ${LB.a.length}</span></div>`; }
document.addEventListener("keydown", e => { if (!$("#lbx").innerHTML) return; if (e.key==="Escape") closeLB(); if (e.key==="ArrowLeft") lbGo(-1); if (e.key==="ArrowRight") lbGo(1); });

  ${staff() ? "" : `<p id="sup" class="sub" style="margin:12px 0 0;font-size:.85rem" hidden>Não resolveu com o vendedor? <a href="https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent("Olá! Preciso de suporte no pedido #"+oid+".")}" target="_blank" rel="noopener" style="color:var(--sky)">Fale direto com o dono</a>.</p>`}`);
  resetPF(); CH = {oid, who, sig:""}; pollChat(); chatT = setInterval(pollChat, 4000);
}
async function pollChat(){
  const box = $("#chat"); if (!box || !CH) return;
  const { data, error } = await sb.from("messages").select("*").eq("order_id", CH.oid).order("created_at");
  if (error){ box.innerHTML = `<p class="err">Chat indisponível: ${esc(error.message)}</p>`; return; }
  const sig = (data||[]).length + ":" + (data||[]).at(-1)?.id;
  if (sig === CH.sig) return;
  await loadProfiles((data||[]).map(m => m.sender));
  if (!CH || !$("#chat")) return;
  const first = !CH.sig, near = box.scrollHeight - box.scrollTop - box.clientHeight < 80; CH.sig = sig;
  box.innerHTML = (data||[]).map(m => { const mine = m.sender === user.id;
    return `<div class="msg ${mine?"me":""}"><small>${msgWho(m, mine)} • ${new Date(m.created_at).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})}</small>${m.image_url ? `<a href="${esc(m.image_url)}" target="_blank" rel="noopener"><img src="${esc(m.image_url)}" alt="Anexo"></a>` : ""}${m.body ? `<div>${esc(m.body)}</div>` : ""}</div>`; }).join("")
    || `<p class="empty" style="padding:10px 0">Nenhuma mensagem ainda. Envie o comprovante do Pix para começar.</p>`;
  if (first || near) box.scrollTop = box.scrollHeight;
  if ($("#sup")) $("#sup").hidden = !(data||[]).length;
}
async function sendMsg(){
  const inp = $("#cm"), f = $("#ci").files[0], body = inp.value.trim(); if (!body && !f) return;
  inp.disabled = true; let image_url = null;
  if (f){
    const path = `${user.id}/${Date.now()}-${f.name.replace(/[^\w.]/g,"_")}`;
    const { error } = await sb.storage.from("chat").upload(path, f);
    $("#ci").value = ""; if (error){ inp.disabled = false; return toast("Erro ao enviar foto: " + error.message); }
    image_url = sb.storage.from("chat").getPublicUrl(path).data.publicUrl;
  }
  const { error } = await sb.from("messages").insert({order_id:CH.oid, sender:user.id, sender_name: owner ? "Vendedor" : manager ? "Gerente" : mod ? "Atendente" : me.name, body:body || null, image_url});
  inp.disabled = false; if (error) return toast("Erro: " + error.message);
  inp.value = ""; inp.focus(); CH.sig = ""; pollChat();
}

async function setOrder(id, status, pid){
  await sb.from("orders").update({status}).eq("id", id);
  if (status === "cancelled"){ const { data:p } = await sb.from("products").select("stock").eq("id", pid).single(); await sb.from("products").update({status:"available", stock:(p?.stock||0)+1}).eq("id", pid); }
  await loadProducts(); render(); toast("Atualizado");
}
async function deliver(id){
  const info = $("#d"+id).value.trim(); if (!info) return toast("Escreva os dados da conta");
  const { error } = await sb.rpc("deliver_order", {p_order:id, p_info:info});
  if (error) return toast(error.message);
  await loadProducts(); render(); toast("Entregue ao cliente");
}

/* ---------- Cupons (admin) ---------- */
async function adminCoupons(){
  const { data:cs, error } = await sb.from("coupons").select("*").order("id", {ascending:false});
  const val = c => c.kind === "percent" ? `${Number(c.value)}%` : brl(c.value);
  $("#adm").innerHTML = `<h3 style="margin-top:0">Novo cupom</h3>
  <div class="row" style="align-items:flex-end">
    <div style="flex:1;min-width:140px"><label>Código</label><input id="c_code" maxlength="30" placeholder="EX: BEMVINDO10" style="text-transform:uppercase"></div>
    <div style="flex:1;min-width:130px"><label>Tipo</label><select id="c_kind"><option value="percent">Porcentagem (%)</option><option value="fixed">Valor fixo (R$)</option></select></div>
    <div style="flex:1;min-width:100px"><label>Valor</label><input id="c_val" type="number" step="0.01" min="0"></div>
    <div style="flex:1;min-width:120px"><label>Limite de usos</label><input id="c_max" type="number" min="1" step="1" placeholder="ilimitado"></div>
    <div style="flex:1;min-width:150px"><label>Validade (opcional)</label><input id="c_exp" type="date"></div>
    <button class="btn pri" onclick="saveCoupon()">Criar cupom</button></div>
  <div id="msg" class="err"></div>
  <p class="sub" style="font-size:.85rem;margin-top:8px">Cada cliente usa o mesmo cupom 1 vez. O desconto VIP (7%) não soma com cupom: vale o maior.</p>
  <h3>Cupons</h3>` + (error ? `<p class="err">${esc(error.message)}</p>` : (cs||[]).length ? `<div style="overflow-x:auto"><table><tr><th>Código</th><th>Desconto</th><th>Usos</th><th>Validade</th><th>Status</th><th>Ação</th></tr>` +
  cs.map(c => { const exp = c.expires_at && new Date(c.expires_at) < new Date();
    return `<tr><td><b>${esc(c.code)}</b></td><td>${val(c)}</td><td>${c.used}${c.max_uses ? ` / ${c.max_uses}` : ""}</td><td>${c.expires_at ? new Date(c.expires_at).toLocaleDateString("pt-BR") : "—"}</td><td><span class="tag ${c.active && !exp ? "delivered" : "cancelled"}">${exp ? "Expirado" : c.active ? "Ativo" : "Desativado"}</span></td>
    <td><button class="btn sm" onclick="toggleCoupon(${c.id},${!c.active})">${c.active ? "Desativar" : "Ativar"}</button> <button class="btn sm red" onclick="delCoupon(${c.id})">Excluir</button></td></tr>`; }).join("") + `</table></div>` : `<p class="empty">Nenhum cupom criado ainda.</p>`);
}
async function saveCoupon(){
  const code = $("#c_code").value.trim().toUpperCase().replace(/\s+/g, ""), kind = $("#c_kind").value, value = parseFloat($("#c_val").value);
  const max = $("#c_max").value ? parseInt($("#c_max").value) : null, exp = $("#c_exp").value;
  if (!code || !(value > 0)){ $("#msg").textContent = "Informe o código e o valor."; return; }
  if (kind === "percent" && value > 90){ $("#msg").textContent = "Porcentagem máxima: 90%."; return; }
  const { error } = await sb.from("coupons").insert({code, kind, value, max_uses:max, expires_at: exp ? new Date(exp + "T23:59:59").toISOString() : null});
  if (error){ $("#msg").textContent = error.code === "23505" ? "Já existe um cupom com esse código." : error.message; return; }
  toast("Cupom criado"); adminCoupons();
}
async function toggleCoupon(id, on){ await sb.from("coupons").update({active:on}).eq("id", id); adminCoupons(); }
async function delCoupon(id){
  if (!confirm("Excluir este cupom?")) return;
  const { error } = await sb.from("coupons").delete().eq("id", id);
  if (error) return toast("Não dá para excluir um cupom já usado. Desative-o.");
  adminCoupons();
}

/* ---------- Moderadores (admin) ---------- */
async function adminMods(){
  const { data:ms } = await sb.from("profiles").select("*").eq("is_mod", true);
  $("#adm").innerHTML = `<p class="sub">Digite o e-mail de uma conta já cadastrada na loja. Moderadores só veem as compras com pagamento confirmado, usam o chat e entregam o produto.</p>
  <div class="row" style="flex-wrap:nowrap"><input id="m_em" type="email" placeholder="email@exemplo.com"><button class="btn pri" onclick="addMod()">Adicionar</button></div><div id="msg" class="err"></div>
  <h3>Moderadores</h3>` + ((ms||[]).map(m => `<div class="row rev"><span style="margin-right:auto">${avatar(m.avatar_url, m.name || m.email, 30)}<b>${esc(m.name || "(sem nome)")}</b><br><small>${esc(m.email)}</small></span><button class="btn sm red" data-em="${esc(m.email)}" onclick="rmMod(this.dataset.em)">Remover</button></div>`).join("") || `<p class="empty">Nenhum moderador ainda.</p>`);
}
async function addMod(){
  const em = $("#m_em").value.trim(); if (!em) return;
  const { error } = await sb.rpc("set_moderator", {p_email:em, p_on:true});
  if (error){ $("#msg").textContent = error.message; return; }
  toast("Moderador adicionado"); adminMods();
}
async function rmMod(em){
  if (!confirm("Remover este moderador?")) return;
  const { error } = await sb.rpc("set_moderator", {p_email:em, p_on:false});
  if (error) return toast(error.message);
  toast("Moderador removido"); adminMods();
}
/* ---------- Tags (dono e gerente) ---------- */
let U = {us:[], ts:[], uts:[]}, uChanged = false;
async function adminTags(){
  const { data:ts, error } = await sb.from("tags").select("*").order("id");
  $("#adm").innerHTML = `<h3 style="margin-top:0">Nova tag</h3>
  <div class="row" style="align-items:flex-end">
    <div style="flex:2;min-width:170px"><label for="t_n">Nome (até 20 letras)</label><input id="t_n" maxlength="20" placeholder="Ex: Parceiro" oninput="tagPrev()"></div>
    <div style="width:90px"><label for="t_c">Cor</label><input id="t_c" type="color" value="#2f7bff" style="padding:2px;height:42px" oninput="tagPrev()"></div>
    <div style="flex:1;min-width:120px"><label>Prévia</label><div id="t_p" style="min-height:42px;display:flex;align-items:center"></div></div>
    <button class="btn pri" onclick="saveTag()">Criar tag</button></div>
  <div id="msg" class="err"></div>
  <p class="sub" style="font-size:.85rem;margin-top:8px">Depois de criar, entregue a tag para alguém na aba <b>Usuários</b>. A tag aparece no perfil, no chat e nas avaliações.</p>
  <h3>Tags criadas</h3>` + (error ? `<p class="err">${esc(error.message)}</p>` : (ts || []).map(t => `<div class="urow"><span style="margin-right:auto">${tagH(t)}</span>
    <input id="tn${t.id}" value="${esc(t.name)}" maxlength="20" style="width:160px" aria-label="Nome da tag"><input id="tc${t.id}" type="color" value="${esc(t.color)}" style="width:60px;padding:2px;height:38px" aria-label="Cor da tag">
    <button class="btn sm" onclick="updTag(${t.id})">Salvar</button><button class="btn sm red" onclick="delTag(${t.id})">Excluir</button></div>`).join("") || `<p class="empty">Nenhuma tag criada ainda.</p>`);
  tagPrev();
}
function tagPrev(){ const el = $("#t_p"); if (el) el.innerHTML = tagH({name:$("#t_n").value.trim() || "Prévia", color:$("#t_c").value}); }
async function saveTag(){
  const name = $("#t_n").value.trim(), color = $("#t_c").value;
  if (!name){ $("#msg").textContent = "Digite o nome da tag."; return; }
  const { error } = await sb.from("tags").insert({name, color});
  if (error){ $("#msg").textContent = error.code === "23505" ? "Já existe uma tag com esse nome." : error.message; return; }
  toast("Tag criada"); adminTags();
}
async function updTag(id){
  const name = $("#tn" + id).value.trim(), color = $("#tc" + id).value;
  if (!name) return toast("Digite o nome da tag.");
  const { error } = await sb.from("tags").update({name, color}).eq("id", id);
  if (error) return toast(error.code === "23505" ? "Já existe uma tag com esse nome." : error.message);
  toast("Tag atualizada"); adminTags();
}
async function delTag(id){
  if (!confirm("Excluir esta tag? Ela será removida de todas as pessoas que a têm.")) return;
  const { error } = await sb.from("tags").delete().eq("id", id);
  if (error) return toast(error.message);
  toast("Tag excluída"); adminTags();
}

/* ---------- Usuários (dono e gerente): buscar, ver perfil, dar tags ---------- */
async function adminUsers(){
  const [{ data:us, error }, { data:ts }, { data:uts }] = await Promise.all([sb.from("profiles").select("*").order("email"), sb.from("tags").select("*").order("id"), sb.from("user_tags").select("*")]);
  U = {us:us || [], ts:ts || [], uts:uts || []};
  $("#adm").innerHTML = error ? `<p class="err">${esc(error.message)}</p>` : `<input id="u_q" type="search" placeholder="Buscar por nome ou e-mail..." oninput="listUsers()" aria-label="Buscar usuário"><div id="u_list" style="margin-top:12px"></div>`;
  if (!error) listUsers();
}
function listUsers(){
  const box = $("#u_list"); if (!box) return;
  const q = ($("#u_q")?.value || "").toLowerCase().trim();
  const all = U.us.filter(u => !q || (u.name || "").toLowerCase().includes(q) || (u.email || "").toLowerCase().includes(q));
  box.innerHTML = all.slice(0, 60).map(u => {
    const mine = U.uts.filter(x => x.user_id === u.id).map(x => U.ts.find(t => t.id === x.tag_id)).filter(Boolean);
    const role = u.is_admin ? "owner" : u.is_manager ? "manager" : u.is_mod ? "mod" : "";
    return `<div class="urow">${avatar(u.avatar_url, u.name || u.email, 38)}<span style="margin-right:auto;min-width:0"><b>${esc(u.name || "(sem nome)")}</b>${roleH(role)}${vipH(u.vip)}${tagsH(mine)}<br><small>${esc(u.email)}</small></span>
    <button class="btn sm" onclick="openProfile('${u.id}')">Ver perfil</button><button class="btn sm pri" onclick="tagModal('${u.id}')">Tags</button></div>`; }).join("")
    + (all.length > 60 ? `<p class="sub" style="font-size:.85rem">Mostrando 60 de ${all.length}. Refine a busca.</p>` : "") || `<p class="empty">Nenhum usuário encontrado.</p>`;
}
function tagModal(uid){
  const u = U.us.find(x => x.id === uid); if (!u) return;
  const has = new Set(U.uts.filter(x => x.user_id === uid).map(x => x.tag_id)); uChanged = false;
  modal(`<h2>Tags de ${esc(u.name || u.email)}</h2>` + (U.ts.length ? U.ts.map(t => `<label style="display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--txt);margin:8px 0;font-size:1rem"><input type="checkbox" style="width:auto" ${has.has(t.id) ? "checked" : ""} onchange="toggleUserTag('${uid}',${t.id},this.checked,this)">${tagH(t)}</label>`).join("") : `<p class="empty">Crie tags primeiro, na aba <b>Tags</b>.</p>`)
    + `<div class="row" style="margin-top:14px"><button class="btn pri" onclick="doneTags('${uid}')">Pronto</button></div>`);
}
async function toggleUserTag(uid, tid, on, el){
  const { error } = on ? await sb.from("user_tags").insert({user_id:uid, tag_id:tid}) : await sb.from("user_tags").delete().eq("user_id", uid).eq("tag_id", tid);
  if (error){ el.checked = !on; return toast(error.message); }
  if (on) U.uts.push({user_id:uid, tag_id:tid}); else U.uts = U.uts.filter(x => !(x.user_id === uid && x.tag_id === tid));
  if (uid === user.id) uChanged = true;
}
async function doneTags(uid){
  closeM(); listUsers(); resetPF();
  if (uChanged){ await loadMyTags(); render(); }
}

/* ---------- Gerentes (só o dono) ---------- */
async function adminManagers(){
  const { data:ms } = await sb.from("profiles").select("*").eq("is_manager", true);
  $("#adm").innerHTML = `<p class="sub">Digite o e-mail de uma conta já cadastrada na loja. O gerente faz quase tudo que o dono faz: pedidos, anúncios, cupons, moderadores e produtos recomendados. Só o dono adiciona ou remove gerentes.</p>
  <div class="row" style="flex-wrap:nowrap"><input id="g_em" type="email" placeholder="email@exemplo.com"><button class="btn pri" onclick="addMgr()">Adicionar</button></div><div id="msg" class="err"></div>
  <h3>Gerentes</h3>` + ((ms||[]).map(m => `<div class="row rev"><span style="margin-right:auto">${avatar(m.avatar_url, m.name || m.email, 30)}<b>${esc(m.name || "(sem nome)")}</b><br><small>${esc(m.email)}</small></span><button class="btn sm red" data-em="${esc(m.email)}" onclick="rmMgr(this.dataset.em)">Remover</button></div>`).join("") || `<p class="empty">Nenhum gerente ainda.</p>`);
}
async function addMgr(){
  const em = $("#g_em").value.trim(); if (!em) return;
  const { error } = await sb.rpc("set_manager", {p_email:em, p_on:true});
  if (error){ $("#msg").textContent = error.message; return; }
  toast("Gerente adicionado"); adminManagers();
}
async function rmMgr(em){
  if (!confirm("Remover este gerente?")) return;
  const { error } = await sb.rpc("set_manager", {p_email:em, p_on:false});
  if (error) return toast(error.message);
  toast("Gerente removido"); adminManagers();
}
async function toggleFeat(id, on){
  const { error } = await sb.from("products").update({featured:on}).eq("id", id);
  if (error) return toast("Erro: " + error.message);
  await loadProducts(); adminProducts(); toast(on ? "Adicionado aos recomendados" : "Removido dos recomendados");
}
function adminProducts(){
  $("#adm").innerHTML = `<button class="btn pri" onclick="productForm()">Adicionar anúncio</button><div class="grid" style="margin-top:18px">${products.map(p => `<div class="card" style="cursor:default">
    ${p.images[0] ? `<img src="${esc(p.images[0])}" alt="">` : ""}<div class="in"><span class="tag ${p.status}">${ST[p.status]}</span><b>${esc(p.title)}</b><small>${esc(p.category)} • ${p.stock} em estoque</small>${priceH(p)}
    <div class="row"><button class="btn sm" onclick="productForm('${p.id}')">Editar</button><button class="btn sm" onclick="toggleFeat('${p.id}',${!p.featured})">${p.featured ? "★ Recomendado" : "☆ Recomendar"}</button><button class="btn sm red" onclick="delProduct('${p.id}')">Excluir</button></div></div></div>`).join("")}</div>`;
}
function pfImgs(){ $("#pf").innerHTML = PF.map((u,i) => `<div class="th"><img src="${esc(u)}" alt=""><button type="button" class="btn red sm" onclick="PF.splice(${i},1);pfImgs()" aria-label="Remover foto">×</button></div>`).join(""); }
function productForm(id){
  const p = products.find(x => x.id === id) || {title:"", description:"", price:"", old_price:"", images:[], status:"available", category:"Contas", stock:1, featured:false};
  PF = [...p.images];
  modal(`<h2>${id ? "Editar anúncio" : "Novo anúncio"}</h2>
  <label>Título (ex.: Fruta Magma, ou Lv 2970 • Shark V4)</label><input id="f_t" value="${esc(p.title)}">
  <label>Descrição</label><textarea id="f_d" rows="4">${esc(p.description)}</textarea>
  <div class="row"><div style="flex:1"><label>Preço (R$)</label><input id="f_p" type="number" step="0.01" value="${p.price}"></div><div style="flex:1"><label>Preço antigo (riscado)</label><input id="f_o" type="number" step="0.01" value="${p.old_price ?? ""}"></div></div>
  <div class="row"><div style="flex:1"><label>Categoria</label><select id="f_c">${CATS.map(c => `<option ${p.category===c?"selected":""}>${c}</option>`).join("")}</select></div>
  <div style="flex:1"><label>${id ? "Quantidade em estoque" : "Quantidade de unidades"}</label><input id="f_q" type="number" min="0" step="1" value="${p.stock}"></div>
  <div style="flex:1"><label>Status</label><select id="f_s">${["available","reserved","sold"].map(s => `<option value="${s}" ${p.status===s?"selected":""}>${ST[s]}</option>`).join("")}</select></div></div>
  <label style="display:flex;gap:8px;align-items:center;color:var(--txt);cursor:pointer"><input id="f_f" type="checkbox" style="width:auto" ${p.featured?"checked":""}> ⭐ Mostrar em Recomendados na página inicial</label>
  <label>Fotos (várias de uma vez; toque no × para remover)</label><div id="pf" class="pf"></div><input id="f_i" type="file" accept="image/*" multiple>
  ${id ? "" : `<p class="sub" style="font-size:.8rem;margin:8px 0 0">Se já existir um anúncio com o mesmo título, você poderá somar as unidades nele.</p>`}
  <div id="msg" class="err"></div><div class="row" style="margin-top:14px"><button id="savebtn" class="btn pri" onclick="saveProduct('${id||""}')">Salvar</button></div>`);
  pfImgs();
}
async function saveProduct(id){
  const btn = $("#savebtn"); btn.disabled = true; btn.textContent = "Salvando...";
  const fail = t => { $("#msg").textContent = t; toast(t); btn.disabled = false; btn.textContent = "Salvar"; };
  try {
    const row = { title:$("#f_t").value.trim(), description:$("#f_d").value, price:parseFloat(String($("#f_p").value).replace(",", ".")), old_price:$("#f_o").value ? parseFloat(String($("#f_o").value).replace(",", ".")) : null, status:$("#f_s").value, category:$("#f_c").value, stock:Math.max(0, parseInt($("#f_q").value) || 0), featured:$("#f_f").checked };
    if (!row.title || !row.price) return fail("Preencha o título e o preço.");
    if (row.stock < 1 && row.status === "available") row.status = "sold";
    let merge = null;
    if (!id){
      merge = products.find(x => norm(x.title) === norm(row.title) && x.category === row.category);
      if (merge && !confirm(`Já existe o anúncio "${merge.title}" com ${merge.stock} unidade(s).\n\nOK = somar ${row.stock} unidade(s) nele\nCancelar = criar um anúncio separado`)) merge = null;
    }
    const images = merge ? [...merge.images] : [...PF], files = [...$("#f_i").files];
    for (let i = 0; i < files.length; i++){
      btn.textContent = `Enviando foto ${i+1} de ${files.length}...`;
      const f = files[i], path = `${Date.now()}-${i}-${f.name.replace(/[^\w.]/g,"_")}`;
      const { error } = await sb.storage.from("products").upload(path, f);
      if (error) return fail("Erro ao enviar foto: " + error.message);
      images.push(sb.storage.from("products").getPublicUrl(path).data.publicUrl);
    }
    btn.textContent = "Salvando...";
    const out = merge ? {stock:merge.stock + row.stock, status:"available", images} : {...row, images}, tid = merge ? merge.id : id;
    const { error } = tid ? await sb.from("products").update(out).eq("id", tid) : await sb.from("products").insert(out);
    if (error) return fail("Erro ao salvar: " + error.message);
    closeM(); await loadProducts(); render(); toast(merge ? "Unidades somadas no anúncio" : "Anúncio salvo");
  } catch (e) { fail("Erro: " + (e.message || e)); }
}
async function delProduct(id){
  if (!confirm("Excluir este anúncio?")) return;
  const { error } = await sb.from("products").delete().eq("id", id);
  if (error) return toast("Não dá para excluir: já existe pedido ligado a ele. Marque como Vendida.");
  await loadProducts(); render();
}
init();
</script>
