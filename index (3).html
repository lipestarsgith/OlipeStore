<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OlipeStore – Contas e frutas de Blox Fruits</title>
<link rel="icon" type="image/png" href="logo.png"><link rel="apple-touch-icon" href="logo.png"><meta name="theme-color" content="#040a1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#030a1f;--panel:#08142e;--panel2:#0c1d40;--line:#2a5fc7;--sky:#3b8cff;--onsky:#021a3a;--neon:#ffffff;--or:#ff3b4e;--or2:#ff7a86;--fd:"Titan One",Sora,system-ui,sans-serif;--cream:#f4ead2;--txt:#f1f7ff;--mut:#8fb0d6;--red:#ff5c5c;--star:#ffc928;--glow:0 0 0 1px #ffffff55,0 0 14px #ffffff44,0 0 32px #3b8cff44;--g1:#1f6bff40;--g2:#ff3b4e1c;--bgc:#030a1f;--bgc2:#071433;--hdr:#030a1fee;--tbg:#ff3b4e;--tbt:#fff}
*{box-sizing:border-box}
html{background:var(--bgc)}body{margin:0;color:var(--txt);font-family:Sora,system-ui,sans-serif;line-height:1.5;background:transparent;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse 65% 50% at 88% -8%,var(--g1),transparent 70%),radial-gradient(ellipse 55% 45% at -5% 105%,var(--g2),transparent 70%),radial-gradient(ellipse 90% 70% at 50% 50%,var(--bgc2) 0,var(--bgc) 75%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(#4d8dff12 1px,transparent 1px),linear-gradient(90deg,#4d8dff12 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:linear-gradient(180deg,#000 0,transparent 75%);mask-image:linear-gradient(180deg,#000 0,transparent 75%)}
a{color:inherit}button,input,textarea,select{font:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:12px 5vw;border-bottom:1px solid #ffffffb0;box-shadow:0 1px 0 #ffffff33,0 8px 28px #000a,0 0 22px #3b8cff33;position:sticky;top:0;background:var(--hdr);backdrop-filter:blur(8px);z-index:5;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-style:normal;letter-spacing:.5px;font-weight:400;font-size:1.6rem;cursor:pointer;margin-right:auto}.brand img{height:46px;width:auto;filter:drop-shadow(0 0 8px #1f6bffcc)}.brand b{color:var(--or)}.brand{text-shadow:0 2px 0 var(--line)}
.hi{color:var(--mut);font-size:.9rem}
.btn{border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--panel);color:var(--txt);border:1px solid var(--line)}
.btn:hover{border-color:var(--sky)}.btn.pri{background:var(--sky);color:var(--onsky);border-color:var(--sky)}.btn.ok{background:#1a8f4d;border-color:#1a8f4d}.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}.sm{padding:6px 12px;font-size:.85rem}
main{padding:24px 5vw 50px;max-width:1200px;margin:auto}
h1,h2{font-family:var(--fd);font-weight:400;font-style:normal;letter-spacing:.4px}h1{font-size:clamp(2rem,5vw,3.4rem);margin:0 0 8px;line-height:1.05;text-shadow:0 3px 0 var(--line)}h2{margin:0 0 12px;font-size:1.5rem;text-shadow:0 2px 0 var(--line)}h3{margin:18px 0 8px}
.sub{color:var(--mut);margin:0 0 20px}
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:1.2fr .8fr;gap:10px 24px;align-items:center;border:1px solid var(--neon);box-shadow:var(--glow);border-radius:6px 28px 6px 28px;padding:28px;margin-bottom:26px;background:radial-gradient(circle at 85% 40%,var(--g1),transparent 55%),linear-gradient(135deg,var(--panel2),var(--bg))}.hero-logo{width:100%;max-width:340px;justify-self:center;animation:floaty 5s ease-in-out infinite;filter:drop-shadow(0 8px 24px #1f6bffaa)}@keyframes floaty{50%{transform:translateY(-8px) rotate(-1deg)}}
.badges{display:flex;gap:8px;flex-wrap:wrap;font-size:.82rem}.badges span{border:1px solid #1f6bff99;background:#0a1f4d99;border-radius:99px;padding:4px 12px;color:var(--txt)}.badges span::before{content:"";display:inline-block;width:7px;height:12px;margin-right:7px;background:var(--or);clip-path:polygon(60% 0,0 58%,45% 58%,30% 100%,100% 40%,55% 40%);vertical-align:-1px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.bar input{flex:1;min-width:220px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:99px;padding:8px 16px;cursor:pointer}.chip.on{background:var(--sky);color:var(--onsky);border-color:var(--sky);box-shadow:var(--glow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--neon);box-shadow:var(--glow);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card:hover{border-color:var(--sky)}
.ph{position:relative}.card img{width:100%;aspect-ratio:16/10;object-fit:cover;background:#02050c;display:block}
.cnt{position:absolute;right:8px;bottom:8px;background:#000a;border-radius:99px;padding:2px 10px;font-size:.75rem}
.card .in{padding:12px 14px;display:flex;flex-direction:column;gap:5px;flex:1;font-size:.92rem}
.price{font-family:var(--fd);font-size:1.5rem;font-weight:400;color:var(--or);text-shadow:0 0 14px color-mix(in srgb,var(--or) 45%,transparent);letter-spacing:.3px}.old{text-decoration:line-through;color:var(--mut);font-size:.9rem;margin-right:8px;font-weight:400}
.stars{color:var(--star);letter-spacing:1px}.stars small,small{color:var(--mut);letter-spacing:0}
.tag{display:inline-block;font-size:.72rem;padding:2px 10px;border-radius:99px;background:var(--line)}
.tag.available{background:#0f6b8f}.tag.sold{background:var(--red)}.tag.reserved,.tag.pending{background:#8a6d00}.tag.paid{background:#176f9c}.tag.delivered{background:#1a8f4d}.tag.cancelled{background:#555}
.modal,.lb{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-start;justify-content:center;padding:4vh 3vw;overflow:auto;z-index:20}
.box{background:var(--bg);border:1px solid var(--neon);box-shadow:var(--glow);border-radius:16px;padding:22px;width:min(760px,100%);position:relative}
.x{position:absolute;right:12px;top:10px;z-index:2}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
input,textarea,select{width:100%;background:#02050c;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,textarea:focus,select:focus{border-color:var(--neon);box-shadow:var(--glow)}
.gal{display:flex;gap:8px;overflow-x:auto;margin:12px 0}.gal img{height:130px;border-radius:10px;cursor:zoom-in;border:1px solid var(--line)}
.lb{z-index:40;align-items:center;background:#000d}.lb img{max-width:min(94vw,1100px);max-height:86vh;border-radius:10px}.lb .cnt{position:fixed;bottom:18px;right:50%;transform:translateX(50%)}
.nav{position:fixed;top:50%;font-size:1.6rem;padding:6px 16px}.nav.l{left:14px}.nav.r{right:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pix{background:#02050c;border:1px dashed var(--sky);border-radius:12px;padding:14px;word-break:break-all;font-weight:600;margin:10px 0}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.9rem}
.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs .btn.on{background:var(--sky);color:var(--onsky)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--sky);color:#00263d;padding:10px 18px;border-radius:10px;font-weight:600;z-index:50}
.err{color:#ff9d9d;font-size:.9rem;margin-top:8px}.empty{color:var(--mut);padding:30px 0}
.chat{height:min(50vh,400px);overflow:auto;background:#02050c;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;background:var(--panel2);border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:8px 12px;align-self:flex-start;word-break:break-word;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:color-mix(in srgb,var(--sky) 32%,var(--bg));border-color:var(--neon);border-radius:12px 12px 3px 12px}
.msg small{display:block;font-size:.7rem;margin-bottom:2px}.msg img{max-width:100%;max-height:220px;border-radius:8px;display:block;margin:4px 0}
.sp{display:flex;gap:2px;margin:6px 0}.sp button{background:none;border:0;font-size:1.8rem;color:#2b3f63;cursor:pointer;padding:0 2px}.sp button.on{color:var(--star)}
.rev{border-top:1px solid var(--line);padding:10px 0}
.pf{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.th{position:relative}.th img{height:70px;border-radius:8px;display:block}.th button{position:absolute;top:2px;right:2px;padding:0 8px}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:0 5vw 28px}
.vipb{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 10px;border-radius:99px;background:linear-gradient(135deg,#ffc928,#ff9d00);color:#2b1c00}.box-vip{border:1px solid var(--star);border-radius:12px;padding:12px 14px;margin:0 0 16px;background:#ffc92812}.ok-t{color:#6ee7a0;font-size:.9rem}
.av{width:var(--s,36px);height:var(--s,36px);border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--neon);background:var(--panel2);vertical-align:middle;margin-right:6px}span.av{display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#00263d;background:linear-gradient(135deg,var(--sky),var(--neon));font-size:calc(var(--s,36px)*.45)}
.me-chip{display:inline-flex;align-items:center;gap:4px;cursor:pointer;background:none;border:0;color:var(--mut);padding:0;font-size:.9rem}.me-chip:hover{color:var(--sky)}.me-chip .av{margin-right:4px}
.pf-card{max-width:460px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--glow)}.pf-card .pf-av{text-align:center;margin-bottom:12px}.pf-card .pf-av .av{margin:0;border-width:3px}.pf-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.msg small .av{margin-right:4px}
.tag-chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.7rem;font-weight:800;margin-left:5px;vertical-align:middle;line-height:1.5;white-space:nowrap}
.pl{cursor:pointer}.pl:hover{text-decoration:underline}
#pfm.modal{z-index:90}
.urow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding:10px 0}.urow .av{margin:0}
.storerate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px}.storerate .stars{font-size:1.6rem}
.menu-btn{display:inline-flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--neon);color:var(--txt);border-radius:10px;width:46px;height:46px;cursor:pointer;box-shadow:var(--glow)}.menu-btn:hover{border-color:var(--sky);color:var(--sky)}
.dr{position:fixed;inset:0;z-index:60;background:#000b;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .25s}.dr.open{opacity:1;visibility:visible;transition:opacity .2s}
.dr-box{position:absolute;right:0;top:0;bottom:0;width:min(330px,88vw);background:var(--bg);border-left:2px solid var(--neon);box-shadow:var(--glow);transform:translateX(100%);transition:transform .25s;overflow:auto;padding:16px 14px 30px}.dr.open .dr-box{transform:none}
.dr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800;color:var(--sky)}
.dr-user{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer}.dr-user .av{margin:0}
.dr-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--txt);padding:11px 12px;border-radius:10px;cursor:pointer;font-size:.98rem;text-decoration:none}.dr-item:hover{background:var(--panel2)}.dr-item.on{background:var(--panel2);border-left-color:var(--sky);font-weight:700}.dr-item.sm{font-size:.9rem;padding:8px 12px;color:var(--mut)}
.dr-sep{border-top:1px solid var(--line);margin:10px 0}.dr-h{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:8px 12px 2px}
.gate{position:fixed;inset:0;z-index:100;background:#02050cf5;display:flex;align-items:center;justify-content:center;padding:3vh 3vw}
.gate-box{background:var(--bg);border:1px solid var(--neon);box-shadow:var(--glow);border-radius:18px;padding:22px;width:min(680px,100%);max-height:94vh;display:flex;flex-direction:column}.gate-box .rules{overflow:auto;flex:1;min-height:0;margin:8px 0 14px;padding-right:4px}
details.acc{border:1px solid var(--line);border-radius:12px;padding:0 14px;margin:8px 0;background:var(--panel)}details.acc summary{cursor:pointer;padding:12px 0;font-weight:700}
.doc h3{margin:16px 0 4px;color:var(--sky);font-size:1rem}.doc h3:first-child{margin-top:4px}.doc p,.doc li{margin:0 0 8px}.doc ul{margin:4px 0 10px;padding-left:20px}
.set-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;max-width:560px}.set-card h3{margin:0 0 8px}
.cd{font-weight:800;color:var(--star)}
@media (max-width:480px){.me-chip>span:not(.av){display:none}}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero-logo{max-width:220px;order:-1}}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.hero{padding:16px}.price{font-size:1.25rem}}

/* ===== OlipeStore: cards 3D, banners, IA ===== */
.card.tilt{position:relative;border-radius:6px 20px 6px 20px;border-color:#ffffffd0;box-shadow:0 10px 26px #000a,0 0 0 1px #ffffff33,0 0 18px var(--bcg,#ffffff2b);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out,translate .6s cubic-bezier(.2,.8,.2,1),opacity .6s;will-change:transform;translate:0 0}
.card.tilt.hot{transition:transform .06s linear}
.card.tilt:not(.seen){opacity:0;translate:0 28px}
.card.tilt::before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1.5px var(--bc,#fff),inset 0 0 22px var(--bcg,#3b8cffaa);opacity:.55;animation:pulseb 3.4s ease-in-out infinite;pointer-events:none;z-index:3}
.card.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:4;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),#ffffff33,transparent 45%);opacity:0;transition:opacity .25s}
.card.tilt.hot::after{opacity:1}
.card.tilt.sweep .ph::after{animation:sweep 1.1s ease-out}
.ph{overflow:hidden}.ph::after{content:"";position:absolute;top:0;bottom:0;width:45%;left:-60%;background:linear-gradient(100deg,transparent,#ffffff55,transparent);transform:skewX(-18deg);pointer-events:none}
.card.tilt .ph img{transform:translate3d(calc(var(--px,0)*-9px),calc(var(--py,0)*-7px),0) scale(1.1);transition:transform .3s ease-out;box-shadow:0 8px 20px #0008}
.card.tilt:hover .ph::after{animation:sweep 1s ease-out}
@keyframes pulseb{50%{opacity:.8}}
@keyframes sweep{to{left:130%}}
.ofr{position:absolute;left:8px;top:8px;z-index:5;font-family:var(--fd);font-style:normal;font-size:1.05rem;padding:3px 12px 3px 10px;color:#fff;background:linear-gradient(180deg,var(--or2),var(--or));clip-path:polygon(0 0,100% 0,88% 50%,100% 100%,0 100%);animation:wob 2.6s ease-in-out infinite;transform-origin:left center}
.ofr.in-box{position:static;display:inline-block;margin-right:12px;vertical-align:middle;font-size:1.3rem}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(2deg) scale(1.08)}}
.pbox{display:flex;align-items:center;flex-wrap:wrap;margin:8px 0}.pbox .price{font-size:2rem}
.box{border-radius:6px 24px 6px 24px;border-color:#fff;background:linear-gradient(180deg,var(--panel2),var(--bg) 160px)}
.box h2{font-size:1.9rem;padding-right:70px}
.gal{scroll-snap-type:x mandatory;perspective:800px;padding:8px 2px}.gal img{height:200px;scroll-snap-align:start;border:2px solid #ffffffbb;box-shadow:0 8px 22px #000a,0 0 14px #ffffff55;transition:transform .2s ease-out;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
/* IA */
#olai-b{position:fixed;right:16px;bottom:16px;z-index:15;display:flex;align-items:center;gap:8px;border:2px solid #fff;background:linear-gradient(180deg,var(--panel2),var(--bg));color:var(--txt);border-radius:99px;padding:8px 16px 8px 10px;cursor:pointer;box-shadow:0 6px 20px #000a,0 0 18px #1f6bff88;font-family:var(--fd);font-size:1.05rem;font-style:normal}
#olai-b img{width:34px;height:34px;object-fit:contain}#olai-b:hover{border-color:var(--sky)}
#olai-b.pulse::after{content:"";position:absolute;inset:-5px;border-radius:99px;border:2px solid var(--or);animation:ring 1.8s ease-out 3}
@keyframes ring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.25)}}
#olai{position:fixed;right:16px;bottom:16px;z-index:45;width:min(380px,calc(100vw - 24px));height:min(560px,calc(100dvh - 32px));display:none;flex-direction:column;background:var(--bg);border:2px solid var(--neon);border-radius:6px 22px 6px 22px;box-shadow:0 12px 40px #000c,var(--glow);overflow:hidden}
#olai.open{display:flex}
.olai-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(180deg,var(--panel2),var(--panel));border-bottom:2px solid var(--neon)}
.olai-h img{width:38px;height:38px;object-fit:contain}.olai-h b{font-family:var(--fd);font-style:normal;font-weight:400;font-size:1.15rem;flex:1;line-height:1.1}.olai-h small{display:block;font-family:Sora,sans-serif;font-style:normal;font-size:.68rem;color:var(--mut)}
.olai-h button{background:none;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:4px 10px;cursor:pointer}
#olai-l{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#02050c;overscroll-behavior:contain}
.olm{max-width:86%;padding:8px 12px;border-radius:12px 12px 12px 3px;background:var(--panel2);border:1px solid var(--line);align-self:flex-start;word-break:break-word;white-space:pre-wrap;font-size:.92rem}
.olm.me{align-self:flex-end;background:color-mix(in srgb,var(--sky) 32%,var(--bg));border-color:var(--neon);border-radius:12px 12px 3px 12px}
.olm.typ{color:var(--mut)}.olm.typ i{animation:blink 1.2s infinite;font-style:normal}.olm.typ i:nth-child(2){animation-delay:.2s}.olm.typ i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.2}}
.olai-q{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0}.olai-q button{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:99px;padding:4px 12px;font-size:.78rem;cursor:pointer}
.olai-f{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}.olai-f input{flex:1;min-width:0}
@media (max-width:560px){#olai{right:0;bottom:0;width:100vw;height:86dvh;border-radius:18px 18px 0 0}#olai-b span{display:none}#olai-b{padding:8px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.card.tilt:not(.seen){opacity:1;translate:none}.card.tilt{transform:none!important}.card.tilt .ph img{transform:none!important}}

/* ===== Saldo e Encontre players ===== */
.balchip{background:var(--panel2);border-color:var(--or);color:#fff;font-family:var(--fd);font-weight:400;font-size:.95rem;padding:6px 12px}
.walcard{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--panel2),var(--bg));border:1px solid var(--neon);border-radius:6px 22px 6px 22px;padding:22px;margin-bottom:18px;box-shadow:var(--glow)}
.walcard .big{font-family:var(--fd);font-size:2.6rem;color:var(--or);line-height:1;text-shadow:0 0 16px color-mix(in srgb,var(--or) 45%,transparent)}
.walgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:760px){.walgrid{grid-template-columns:1fr}}
.pos{color:#6ee7a0}.neg{color:#ff9d9d}
.lob{max-width:860px}
.lobl{height:min(56vh,520px);overflow:auto;background:#02050c;border:1px solid var(--line);border-radius:12px;padding:4px 12px;overscroll-behavior:contain}
.lm{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #12306b77}.lm:last-child{border-bottom:0}
.lm .av{margin:0;cursor:pointer}
.lm-c{min-width:0;flex:1}
.lm-h{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center}

/* ===== Frutas animadas ===== */
.card.fruit .ph img{animation:hop 1.9s cubic-bezier(.3,.1,.3,1) infinite;transform-origin:50% 100%}
.card.fruit:nth-child(2n) .ph img{animation-delay:-.6s}.card.fruit:nth-child(3n) .ph img{animation-delay:-1.2s}.card.fruit:nth-child(5n) .ph img{animation-delay:-.3s}
@keyframes hop{0%,100%{translate:0 0;scale:1 1}12%{translate:0 0;scale:1.05 .93}38%{translate:0 -11px;scale:.98 1.05}58%{translate:0 0;scale:1 1}66%{translate:0 0;scale:1.04 .95}74%{translate:0 0;scale:1 1}}
.card.fruit .ph::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 62%,#ff9f1c55,transparent 62%),radial-gradient(circle at 50% 100%,#1f6bff55,transparent 55%);mix-blend-mode:screen;animation:aura 2.4s ease-in-out infinite}
@keyframes aura{50%{opacity:.45}}
.card.fruit.jump .ph img{animation:bigjump .7s cubic-bezier(.2,.8,.3,1) 1}
@keyframes bigjump{0%{translate:0 0;scale:1.08 .88}30%{translate:0 -26px;scale:.94 1.1}60%{translate:0 0;scale:1.08 .9}80%{translate:0 -6px;scale:1 1}100%{translate:0 0;scale:1 1}}
.sp{position:absolute;z-index:6;left:var(--x);top:var(--y);width:9px;height:15px;pointer-events:none;background:var(--c);clip-path:polygon(60% 0,0 58%,45% 58%,30% 100%,100% 40%,55% 40%);animation:spark .75s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%) scale(.6) rotate(0)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(var(--r))}}
.hfruit{position:absolute;z-index:1;width:var(--s);height:var(--s);object-fit:cover;border-radius:50%;border:2px solid #4d8dff;box-shadow:0 8px 20px #0009,0 0 18px #1f6bff99;pointer-events:none;left:var(--l);top:var(--t);animation:hbounce var(--dur) cubic-bezier(.3,.1,.3,1) infinite;animation-delay:var(--dl)}
@keyframes hbounce{0%,100%{translate:0 0;rotate:-6deg;scale:1 1}15%{scale:1.06 .92}45%{translate:0 -22px;rotate:8deg;scale:.97 1.05}65%{translate:0 0;rotate:-6deg;scale:1.05 .94}78%{scale:1 1}}
.hero>div,.hero>.hero-logo{position:relative;z-index:2}
@media (max-width:720px){.hfruit{--s:46px!important}.hfruit:nth-of-type(n+4){display:none}}

html[data-theme=pascoa]{--bg:#0a1620;--panel:#102232;--panel2:#16304a;--line:#4aa89a;--sky:#7ee8d0;--onsky:#052a24;--or:#ff8fc7;--or2:#ffc2e2;--g1:#7ee8d033;--g2:#ffd86b24;--bgc:#0a1620;--bgc2:#102a3d;--hdr:#0a1620ee;--tbg:#ff8fc7;--tbt:#33001d;--glow:0 0 0 1px #ffffff55,0 0 14px #ffffff44,0 0 32px #7ee8d055}

html[data-theme=blackfriday] header::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;pointer-events:none;background:repeating-linear-gradient(-45deg,#111 0 9px,#ffe14a 9px 18px);background-size:25px 25px;animation:haz 1s linear infinite}
html[data-theme=blackfriday] .price{text-shadow:0 0 14px #ffe14a88}
.tbar{overflow:hidden;white-space:nowrap;background:var(--tbg);color:var(--tbt);font-family:var(--fd);letter-spacing:.8px;font-size:.95rem;padding:6px 0;border-bottom:2px solid #fff;position:relative;z-index:6}
.tmq{display:inline-flex;animation:marq 30s linear infinite}.tmq span{padding:0 44px}.tmq span::after{content:"◆";margin-left:88px;opacity:.7}
@keyframes marq{to{transform:translateX(-50%)}}
#tfx{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden}
.tp{position:absolute;left:var(--x);top:0;font-size:var(--z);color:var(--or);opacity:.85;animation:tfall var(--d) linear var(--dl) infinite;will-change:transform}
@keyframes tfall{from{transform:translate3d(0,-8vh,0) rotate(0)}to{transform:translate3d(var(--sw),108vh,0) rotate(var(--rot))}}
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.thc{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;color:var(--txt);text-align:left;display:flex;flex-direction:column;gap:8px;transition:translate .15s,border-color .15s}

/* ===== Efeitos de anúncio ===== */
.fxl{position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;overflow:hidden;animation:fxp 2.4s ease-in-out infinite}
.fxl::before,.fxl::after{content:"";position:absolute;inset:0}
@keyframes fxp{50%{opacity:.7}}
@keyframes haz{to{background-position:25px 0}}
@keyframes bub{to{background-position:0 -40px}}
@keyframes snowf{to{background-position:0 40px,13px 47px}}
@keyframes twk{from{opacity:.25}to{opacity:1}}
@keyframes scan{from{background-position:150% 0}to{background-position:-50% 0}}
@keyframes flame{from{transform:scaleY(.82)}to{transform:scaleY(1.14) translateX(3px)}}
@keyframes flash{0%,86%,100%{opacity:0}88%{opacity:1}90%{opacity:.15}92%{opacity:.95}}
@keyframes fog{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
.fxr{position:absolute;right:0;top:12px;z-index:7;font-family:var(--fd);font-size:.78rem;letter-spacing:.6px;padding:3px 10px 3px 16px;color:var(--fxt,#000);background:var(--bc);clip-path:polygon(12% 0,100% 0,100% 100%,12% 100%,0 50%);animation:fxb 1.8s ease-in-out infinite}
@keyframes fxb{50%{filter:brightness(1.4)}}
.fxban{position:relative;height:46px;border-radius:10px;overflow:hidden;margin:0 0 12px;display:flex;align-items:center;justify-content:center;border:1px solid var(--bc);box-shadow:0 0 20px var(--bcg);background:#000c;font-family:var(--fd);letter-spacing:1.5px;color:var(--bc);font-size:1.15rem}
.fxban b{position:relative;z-index:3;font-weight:400;text-shadow:0 0 12px var(--bcg)}
.box[class*=fx-]{border-color:var(--bc);box-shadow:0 0 28px var(--bcg)}
.fx-radioativo{--bc:#7dff3a;--bcg:#7dff3acc;--fxt:#0a1a00}
.fx-radioativo .fxl{box-shadow:inset 0 -34px 44px -12px #7dff3a88}
.fx-radioativo .fxl::before{background:radial-gradient(circle,#c7ff8f 2px,transparent 3px) 0 0/36px 36px,radial-gradient(circle,#7dff3a 1.5px,transparent 2.5px) 14px 18px/25px 25px;animation:bub 4s linear infinite}
.fx-radioativo .fxl::after{top:auto;height:7px;background:repeating-linear-gradient(-45deg,#0a0a0a 0 9px,#7dff3a 9px 18px);background-size:25px 25px;animation:haz 1s linear infinite}
.fx-blackfriday{--bc:#ff2a3c;--bcg:#ff2a3ccc;--fxt:#fff}
.fx-blackfriday .fxl::before{background:linear-gradient(115deg,transparent 40%,#ff2a3c77 50%,transparent 60%);background-size:250% 100%;animation:scan 2.2s linear infinite}
.fx-blackfriday .fxl::after{top:auto;height:7px;background:repeating-linear-gradient(-45deg,#111 0 9px,#ffe14a 9px 18px);background-size:25px 25px;animation:haz 1s linear infinite}
.fx-blackfriday .price{color:#ffe14a}
.fx-fogo{--bc:#ff7a1a;--bcg:#ff5a00cc;--fxt:#1a0800}
.fx-fogo .fxl::before{background:radial-gradient(ellipse 60% 40% at 20% 100%,#ffb300aa,transparent),radial-gradient(ellipse 50% 46% at 55% 100%,#ff5a00bb,transparent),radial-gradient(ellipse 60% 38% at 85% 100%,#ffb300aa,transparent);transform-origin:50% 100%;animation:flame .9s ease-in-out infinite alternate}
.fx-fogo .fxl::after{background:radial-gradient(circle,#ffd27a 1.5px,transparent 2.5px) 0 0/34px 34px;animation:bub 3s linear infinite}
.fx-gelo{--bc:#9be7ff;--bcg:#6fd3ffcc;--fxt:#00243a}
.fx-gelo .fxl::before{background:linear-gradient(120deg,transparent 35%,#ffffff88 50%,transparent 65%);background-size:250% 100%;animation:scan 3s linear infinite}
.fx-gelo .fxl::after,.fx-natal .fxl::before{background:radial-gradient(circle,#fff 1.5px,transparent 2px) 0 0/40px 40px,radial-gradient(circle,#dff6ff 1px,transparent 1.5px) 13px 20px/27px 27px;animation:snowf 5s linear infinite}
.fx-ouro{--bc:#ffd23f;--bcg:#ffc400cc;--fxt:#2b2000}
.fx-ouro .fxl::before{background:linear-gradient(110deg,transparent 40%,#fff3b0bb 50%,transparent 60%);background-size:250% 100%;animation:scan 2s linear infinite}
.fx-ouro .fxl::after{background:radial-gradient(circle,#fff7c2 1.5px,transparent 2.5px) 0 0/52px 52px;animation:twk 1.4s ease-in-out infinite alternate}
.fx-relampago{--bc:#4cc9ff;--bcg:#4cc9ffdd;--fxt:#00243a}
.fx-relampago .fxl::before{background:radial-gradient(circle at 70% 30%,#bfeaffbb,transparent 55%);animation:flash 3s infinite}
.fx-relampago .fxl::after{inset:auto auto 14% 8%;width:26px;height:42px;background:linear-gradient(#e6f7ff,#4cc9ff);clip-path:polygon(60% 0,0 58%,45% 58%,30% 100%,100% 40%,55% 40%);animation:flash 3s infinite .4s}
.fx-halloween{--bc:#ff8a1f;--bcg:#ff8a1fcc;--fxt:#1a0b00}
.fx-halloween .fxl::before{background:radial-gradient(ellipse 80% 40% at 30% 100%,#ff8a1f66,transparent),radial-gradient(ellipse 70% 40% at 80% 100%,#7a2cff55,transparent);animation:fog 4s ease-in-out infinite alternate}
.fx-halloween .fxl::after{background:radial-gradient(circle,#ff8a1f 1.5px,transparent 2.5px) 0 0/44px 44px;animation:bub 6s linear infinite}
.fx-natal{--bc:#ff3b4e;--bcg:#1fd16bcc;--fxt:#fff}
.fx-natal .fxl::after{top:auto;height:7px;background:repeating-linear-gradient(45deg,#ff3b4e 0 9px,#fff 9px 18px);background-size:25px 25px;animation:haz 1s linear infinite}
/* ===== Animações gerais do site ===== */
#app>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}

.modal{animation:fadein .2s ease-out}.modal .box{animation:pop .3s cubic-bezier(.2,.9,.3,1.15)}
@keyframes fadein{from{opacity:0}}@keyframes pop{from{opacity:0;scale:.94;translate:0 14px}}
.btn{transition:translate .15s,border-color .15s,background-color .15s,box-shadow .2s}
.btn:not(:disabled):hover{translate:0 -1px;box-shadow:0 4px 16px #0008,0 0 12px #ffffff33}
.btn.pri{background-image:linear-gradient(100deg,transparent 35%,#ffffff55 50%,transparent 65%);background-size:250% 100%;background-position:150% 0;background-repeat:no-repeat;transition:background-position .7s,translate .15s,box-shadow .2s}
.btn.pri:not(:disabled):hover{background-position:-50% 0}
.chip{transition:translate .15s,border-color .15s,background-color .15s}.chip:hover{translate:0 -2px;border-color:#fff}
header{transition:padding .25s}header.sm{padding-top:5px;padding-bottom:5px}
.av{transition:box-shadow .25s}.lm .av:hover,.pf-av .av{box-shadow:0 0 0 2px #fff,0 0 16px var(--sky)}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}.pstats div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}.pstats b{display:block;font-family:var(--fd);font-weight:400;color:var(--or)}.pstats small{color:var(--mut)}
#pfm .box::before{content:"";display:block;height:74px;margin:-22px -22px -44px;background:linear-gradient(135deg,var(--sky),var(--or));opacity:.5;border-radius:inherit}
.rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:6px 0 12px}
.hero::after{content:"";position:absolute;right:-30px;top:-20px;bottom:-20px;width:110px;background:linear-gradient(var(--or),transparent);opacity:.2;transform:skewX(-18deg);pointer-events:none}

/* ===== v6: perfil VIP + cantos tematicos ===== */
.tc{position:fixed;z-index:3;pointer-events:none;font-size:clamp(34px,6vw,64px);filter:drop-shadow(0 0 10px #000a);animation:tcs 5s ease-in-out infinite}

#fxc{position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}

.tc{filter:none}
/* ===== v8: novos temas ===== */
html[data-theme=namorados]{--bg:#14060d;--panel:#220a16;--panel2:#301123;--line:#a8325f;--sky:#ff5c9d;--onsky:#2b0014;--or:#ffd1e3;--or2:#fff0f6;--g1:#ff5c9d38;--g2:#ff2a6d1c;--bgc:#14060d;--bgc2:#2a0c1c;--hdr:#14060dee;--txt:#fff0f6;--mut:#d9a0b8;--tbg:#ff5c9d;--tbt:#2b0014;--glow:0 0 0 1px #ffffff55,0 0 14px #ffffff44,0 0 32px #ff5c9d55}
html[data-theme=carnaval]{--bg:#0b0420;--panel:#150a35;--panel2:#1f1048;--line:#7a3cff;--sky:#ff3bb4;--onsky:#2b0020;--or:#ffd23f;--or2:#fff08a;--g1:#ff3bb440;--g2:#3be0ff26;--bgc:#0b0420;--bgc2:#190b44;--hdr:#0b0420ee;--txt:#fff;--mut:#c3b0ef;--tbg:#ff3bb4;--tbt:#fff;--glow:0 0 0 1px #ffffff55,0 0 14px #ffffff44,0 0 32px #3be0ff55}
html[data-theme=copa]{--bg:#02140b;--panel:#072616;--panel2:#0c3320;--line:#1f8f52;--sky:#ffd800;--onsky:#1a1500;--or:#00c46a;--or2:#7dffb6;--g1:#ffd80030;--g2:#1a4dd626;--bgc:#02140b;--bgc2:#06301b;--hdr:#02140bee;--txt:#f2fff7;--mut:#8fcfae;--tbg:#ffd800;--tbt:#0a2b18;--glow:0 0 0 1px #ffffff55,0 0 14px #ffffff44,0 0 32px #ffd80055}
/* ===== v8: sacola ===== */
#bagb{position:relative}
.bagn{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:99px;background:var(--or);color:#fff;font-size:.72rem;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}.bagn[hidden]{display:none}
.bump{animation:bump .4s}@keyframes bump{40%{scale:1.25}}
.crow{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.crow img{width:64px;height:64px;object-fit:cover;border-radius:10px;cursor:pointer;flex:none;background:#02050c}
.cin{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.cin b{word-break:break-word}
.cft{border-top:2px solid var(--line);margin-top:10px;padding-top:6px}
.cadd{margin-top:4px;width:100%}

/* =====================================================================
   v9 – ULTRA FX: aurora, neon animado, vidro, temas cinematográficos
   ===================================================================== */
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
html{scroll-behavior:smooth}
::selection{background:var(--sky);color:var(--onsky)}
*{scrollbar-width:thin;scrollbar-color:var(--sky) transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:linear-gradient(var(--sky),var(--or));border-radius:99px;border:2px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}

/* barra de progresso de rolagem */
#spb{position:fixed;left:0;top:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);z-index:99;pointer-events:none;background:linear-gradient(90deg,var(--sky),var(--or),var(--or2));box-shadow:0 0 12px var(--sky),0 0 22px var(--or)}

/* aurora animada no fundo */
#aur{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#aur i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;opacity:.55;will-change:transform;mix-blend-mode:screen}
#aur i:nth-child(1){left:-18vmax;top:-22vmax;background:radial-gradient(circle,var(--sky) 0,transparent 62%);animation:aur1 24s ease-in-out infinite alternate}
#aur i:nth-child(2){right:-22vmax;top:8vh;background:radial-gradient(circle,var(--or) 0,transparent 62%);opacity:.34;animation:aur2 30s ease-in-out infinite alternate}
#aur i:nth-child(3){left:18vw;bottom:-34vmax;background:radial-gradient(circle,var(--or2) 0,transparent 62%);opacity:.22;animation:aur3 36s ease-in-out infinite alternate}
@keyframes aur1{to{transform:translate(26vw,16vh) scale(1.25)}}
@keyframes aur2{to{transform:translate(-24vw,22vh) scale(.82)}}
@keyframes aur3{to{transform:translate(20vw,-20vh) scale(1.3)}}
#aur::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 45%,#0009 100%)}
body::after{animation:gridmove 18s linear infinite}
@keyframes gridmove{to{background-position:0 56px,56px 0}}

/* luz que segue o mouse */
#mglow{position:fixed;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;z-index:1;opacity:0;transition:opacity .4s;background:radial-gradient(circle,color-mix(in srgb,var(--sky) 22%,transparent),transparent 62%);mix-blend-mode:screen;will-change:transform}
#mglow.on{opacity:1}

/* header de vidro com linha de energia */
header{background:linear-gradient(180deg,color-mix(in srgb,var(--bgc) 92%,transparent),color-mix(in srgb,var(--bgc) 72%,transparent))!important;backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);border-bottom-color:transparent!important}
header::before{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--sky),#fff,var(--or),transparent);background-size:200% 100%;animation:hline 4s linear infinite;box-shadow:0 0 14px var(--sky)}
@keyframes hline{to{background-position:-200% 0}}
.brand{background:linear-gradient(100deg,#fff 20%,var(--sky) 40%,#fff 50%,var(--or) 62%,#fff 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 5s linear infinite;text-shadow:none!important;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--sky) 60%,transparent))}
.brand b{-webkit-text-fill-color:var(--or)}
.brand img{-webkit-text-fill-color:initial;animation:logopulse 3.2s ease-in-out infinite}
@keyframes shine{to{background-position:-250% 0}}
@keyframes logopulse{50%{filter:drop-shadow(0 0 16px var(--sky)) drop-shadow(0 0 30px color-mix(in srgb,var(--or) 70%,transparent));transform:scale(1.05)}}

/* títulos com brilho */
h1{background:linear-gradient(100deg,#fff 30%,var(--sky) 48%,var(--or2) 56%,#fff 72%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 7s linear infinite;text-shadow:none;filter:drop-shadow(0 3px 0 var(--line)) drop-shadow(0 0 18px color-mix(in srgb,var(--sky) 50%,transparent))}
h2{text-shadow:0 2px 0 var(--line),0 0 18px color-mix(in srgb,var(--sky) 55%,transparent)}

/* HERO */
.hero{border-color:transparent;background:radial-gradient(circle at 85% 40%,var(--g1),transparent 55%),linear-gradient(135deg,color-mix(in srgb,var(--panel2) 88%,transparent),color-mix(in srgb,var(--bg) 90%,transparent));backdrop-filter:blur(6px)}
.hero::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:conic-gradient(from var(--ang),var(--sky),#fff,var(--or),var(--or2),var(--sky));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:spin 5s linear infinite;pointer-events:none;z-index:3}
@keyframes spin{to{--ang:360deg}}
.hero-logo{animation:floaty 5s ease-in-out infinite,logoglow 3s ease-in-out infinite!important}
@keyframes logoglow{50%{filter:drop-shadow(0 10px 40px var(--sky)) drop-shadow(0 0 30px var(--or))}}
.badges span{backdrop-filter:blur(6px);transition:translate .2s,box-shadow .2s,background .2s}
.badges span:hover{translate:0 -3px;background:color-mix(in srgb,var(--sky) 30%,transparent);box-shadow:0 0 16px var(--sky)}

/* CARDS: borda neon giratória + holograma */
.card.tilt{border-color:transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,conic-gradient(from var(--ang),#ffffff55,var(--sky),#ffffff55,var(--or),#ffffff55) border-box;border:1.5px solid transparent;transition:transform .25s ease-out,translate .6s cubic-bezier(.2,.8,.2,1),opacity .6s,box-shadow .3s,filter .3s}
.card.tilt:hover,.card.tilt.hot{animation:spin 3s linear infinite;box-shadow:0 18px 44px #000c,0 0 34px color-mix(in srgb,var(--sky) 70%,transparent),0 0 70px color-mix(in srgb,var(--or) 28%,transparent);filter:saturate(1.15) brightness(1.05)}
.card.tilt::after{background:radial-gradient(circle at var(--mx,50%) var(--my,0%),#ffffff55,transparent 38%),linear-gradient(115deg,transparent 30%,color-mix(in srgb,var(--sky) 28%,transparent) 42%,color-mix(in srgb,var(--or) 26%,transparent) 50%,transparent 62%);mix-blend-mode:screen}
.card.tilt:not(.seen){opacity:0;translate:0 40px;scale:.94}
.card.tilt.seen{animation:cardin .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes cardin{from{filter:blur(8px) brightness(2)}to{filter:none}}
.card .in b,.card .in strong{transition:color .2s}
.card:hover .price{animation:pricepop .5s ease}
@keyframes pricepop{40%{transform:scale(1.14);text-shadow:0 0 24px var(--or)}}
.price{background:linear-gradient(100deg,var(--or) 30%,#fff 50%,var(--or) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 4s linear infinite;display:inline-block;text-shadow:none;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--or) 55%,transparent))}
.old{-webkit-text-fill-color:var(--mut)}
.ofr{box-shadow:0 0 18px var(--or);animation:wob 2.6s ease-in-out infinite,ofrg 1.6s ease-in-out infinite alternate}
@keyframes ofrg{to{filter:brightness(1.35) drop-shadow(0 0 8px var(--or))}}
.card.tilt .ph img{transition:transform .5s cubic-bezier(.2,.8,.2,1),filter .4s}
.card.tilt:hover .ph img{filter:saturate(1.25) contrast(1.06)}

/* BOTÕES */
.btn{position:relative;overflow:hidden;isolation:isolate}
.btn.pri{box-shadow:0 0 0 1px #fff3,0 4px 18px color-mix(in srgb,var(--sky) 55%,transparent);animation:btnpulse 2.8s ease-in-out infinite}
@keyframes btnpulse{50%{box-shadow:0 0 0 1px #fff5,0 4px 28px color-mix(in srgb,var(--sky) 90%,transparent),0 0 40px color-mix(in srgb,var(--or) 30%,transparent)}}
.btn:not(:disabled):active{scale:.95}
.rpl{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff9,#fff0 70%);transform:scale(0);animation:rpl .65s ease-out forwards;z-index:-1}
@keyframes rpl{to{transform:scale(1);opacity:0}}
.chip{backdrop-filter:blur(6px)}
.chip.on{animation:chipon .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes chipon{from{scale:.85}}
input,textarea,select{transition:border-color .2s,box-shadow .25s,background .2s}
input:focus,textarea:focus,select:focus{background:color-mix(in srgb,var(--panel) 80%,#000);box-shadow:0 0 0 3px color-mix(in srgb,var(--sky) 35%,transparent),0 0 24px color-mix(in srgb,var(--sky) 45%,transparent)}

/* MODAIS e gaveta */
.modal,.lb{backdrop-filter:blur(10px) saturate(1.3);background:radial-gradient(circle at 50% 30%,#0008,#000d)}
.box{background:linear-gradient(160deg,color-mix(in srgb,var(--panel2) 90%,var(--bg)),var(--bg));position:relative}
.modal:not(#pfm) .box::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang),transparent 0,var(--sky) 20%,transparent 40%,var(--or) 70%,transparent 90%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:spin 6s linear infinite;pointer-events:none}
.modal .box{animation:pop .45s cubic-bezier(.2,.9,.3,1.25)}
.toast{animation:toastin .5s cubic-bezier(.2,.9,.3,1.4);box-shadow:0 8px 30px #000a,0 0 24px var(--sky)}
@keyframes toastin{from{translate:0 40px;opacity:0;scale:.8}}
.dr-box{backdrop-filter:blur(14px);background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 95%,transparent),var(--bg))}
.dr-item{transition:padding .2s,background .2s,border-color .2s,translate .2s}.dr-item:hover{padding-left:20px;border-left-color:var(--or);background:linear-gradient(90deg,color-mix(in srgb,var(--sky) 22%,transparent),transparent)}
.bagn{animation:bagpulse 1.8s ease-in-out infinite}@keyframes bagpulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--or) 0%,transparent),0 0 14px var(--or)}}
.msg{animation:msgin .35s cubic-bezier(.2,.9,.3,1.3)}@keyframes msgin{from{opacity:0;translate:0 12px;scale:.92}}
.tbar{box-shadow:0 4px 24px color-mix(in srgb,var(--tbg) 55%,transparent)}
.tbar::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,#ffffff55 50%,transparent 65%);background-size:250% 100%;animation:hline 3.5s linear infinite;pointer-events:none}

/* raios de luz de fundo (temas) */
#rays{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity 1.2s}
#rays.on{opacity:1}
#rays::before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg at 50% 0%,transparent 0 8deg,var(--rc,#fff1) 8deg 11deg,transparent 11deg 20deg);animation:raysw 40s linear infinite;-webkit-mask:radial-gradient(ellipse at 50% 0,#000,transparent 70%);mask:radial-gradient(ellipse at 50% 0,#000,transparent 70%)}
@keyframes raysw{50%{transform:rotate(8deg) scale(1.1)}}

/* transição circular ao trocar de tema */
#tw{position:fixed;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;z-index:200;pointer-events:none;background:var(--c,#fff);opacity:.9;scale:0;animation:twipe .9s cubic-bezier(.5,0,.2,1) forwards}
@keyframes twipe{70%{opacity:.55}to{scale:260;opacity:0}}

/* relâmpago / vinheta temática */
#fxo{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0}
#fxo.flash{animation:lflash .9s ease-out}
@keyframes lflash{0%{opacity:0}6%{opacity:.85}12%{opacity:.1}18%{opacity:.7}100%{opacity:0}}
html[data-theme=halloween] #fxo{background:radial-gradient(ellipse at 50% 0,#c8a0ff,#7a2cff55 55%,transparent 80%)}
html[data-theme=blackfriday] #fxo{background:radial-gradient(ellipse at 50% 50%,#ff2a3caa,transparent 70%)}
html:not([data-theme]) #fxo{background:radial-gradient(ellipse at 50% 0,#9fd0ff,#3b8cff44 55%,transparent 80%)}

/* ---- TEMAS: atmosfera própria ---- */
html[data-theme=halloween] body::after{background-image:linear-gradient(#ff8a1f14 1px,transparent 1px),linear-gradient(90deg,#7a2cff14 1px,transparent 1px)}

@keyframes flick{0%,92%,96%,100%{opacity:1}94%,98%{opacity:.55}}
html[data-theme=halloween] .hero{animation:hflick 6s ease-in-out infinite}@keyframes hflick{50%{box-shadow:0 0 50px #ff8a1f88,0 0 90px #7a2cff44}}
html[data-theme=natal] .card.tilt:hover{box-shadow:0 18px 44px #000c,0 0 36px #58b8ffcc,0 0 70px #ff3b4e55}
html[data-theme=natal] header::before{background:repeating-linear-gradient(90deg,#ff3b4e 0 28px,#ffd23f 28px 56px,#1fd16b 56px 84px,#58b8ff 84px 112px);background-size:112px 100%;animation:xlights 1.2s steps(2) infinite;height:3px;filter:blur(.4px)}
@keyframes xlights{50%{filter:brightness(1.8) blur(.4px)}}
html[data-theme=blackfriday] header::before{background:repeating-linear-gradient(-45deg,#ffe14a 0 10px,#111 10px 20px);background-size:28px 28px;animation:haz 1s linear infinite}

@keyframes bfshake{0%,94%,100%{translate:0 0}95%{translate:-2px 1px}97%{translate:2px -1px}}

html[data-theme=namorados] .card.tilt:hover{box-shadow:0 18px 44px #000c,0 0 40px #ff5c9dcc,0 0 80px #ff2a6d55}
html[data-theme=namorados] .hero{animation:heart 1.6s ease-in-out infinite}@keyframes heart{14%{scale:1.008}28%{scale:1}42%{scale:1.012}70%{scale:1}}
html[data-theme=carnaval] body::before{animation:carn 8s linear infinite}@keyframes carn{to{filter:hue-rotate(360deg)}}
html[data-theme=carnaval] .card.tilt:hover{box-shadow:0 18px 44px #000c,0 0 40px #ff3bb4cc,0 0 80px #3be0ff66}
html[data-theme=carnaval] .brand,html[data-theme=carnaval] h1{animation:shine 3s linear infinite,carn 6s linear infinite}
html[data-theme=copa] .card.tilt:hover{box-shadow:0 18px 44px #000c,0 0 40px #ffd800cc,0 0 80px #00c46a66}
html[data-theme=copa] header::before{background:linear-gradient(90deg,#00a859 0 33%,#ffd800 33% 66%,#1a4dd6 66%);animation:none;height:3px}

/* modo leve / sem efeitos: desliga o pesado */
html.lite #aur i,html.lite #mglow,html.lite #rays,html.lite .hero::before,html.lite .modal .box::before,html.lite .card.tilt:hover,html.lite header::before,html.lite .tbar::after{animation:none!important}
html.lite #aur i:nth-child(n+2),html.lite #mglow,html.lite #rays{display:none}
html.lite header,html.lite .modal,html.lite .lb,html.lite .dr-box,html.lite .hero{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html.lite .brand,html.lite h1,html.lite .price,html.lite .btn.pri{animation:none!important}
html.lite .card.tilt{background:var(--panel);border:1px solid #ffffffa0}
html.fxoff #aur,html.fxoff #mglow,html.fxoff #rays,html.fxoff #spb{display:none}
@media (prefers-reduced-motion:reduce){#aur i,#rays::before,.hero::before,.modal .box::before,header::before,.brand,h1,.price,.btn.pri,.tbar::after{animation:none!important}#mglow{display:none}}
</style>

async function loadProfiles(ids){

function msgWho(m, mine){

  const label = mine ? "Você" : pr?.role ? esc(m.sender_name || "Equipe") + (pr.name && pr.name !== m.sender_name ? " · " + esc(pr.name) : "") : esc(nm);
  return `<span class="pl" onclick="openProfile('${m.sender}')" title="Ver perfil">${avatar(mine ? me.avatar : pr?.avatar_url, nm, 20)}${label}</span>${tagsH(mine ? me.tags : pr?.tags)}`;
}
function toAvatarBlob(file, size = 320){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement("canvas"), x = c.getContext("2d");
      c.width = c.height = size; x.fillStyle = "#0d1b33"; x.fillRect(0, 0, size, size);
      x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error("Não foi possível processar a imagem.")), "image/jpeg", .88);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Formato não suportado. Use uma foto JPG ou PNG.")); };
    img.src = url;
  });
}

async function saveProfile(){

  me.name = name.slice(0, 40); me.bio = bio.slice(0, 200); delete PFC[user.id]; render(); toast("Perfil salvo");

async function pickAvatar(inp){
  const f = inp.files[0]; inp.value = ""; if (!f) return;
  if (!f.type.startsWith("image/")) return toast("Escolha um arquivo de imagem.");
  if (f.size > 15 * 1024 * 1024) return toast("Imagem muito grande (máximo 15 MB).");
  toast("Enviando foto...");
  try {
    const blob = await toAvatarBlob(f), path = `${user.id}/${Date.now()}.jpg`;
    const { error } = await sb.storage.from("avatars").upload(path, blob, {contentType:"image/jpeg", cacheControl:"3600"});
    if (error) throw error;
    const url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
    const { error:e2 } = await sb.rpc("update_my_profile", {p_avatar:url});
    if (e2) throw e2;
    me.avatar = url; delete PFC[user.id]; cleanOldAvatars(path);
    const dn = $("#pf_n")?.value, db = $("#pf_b")?.value; render(); if ($("#pf_n") && dn != null) $("#pf_n").value = dn; if ($("#pf_b") && db != null) $("#pf_b").value = db;
    toast("Foto atualizada");
  } catch (e) { toast(e.message || "Erro ao enviar a foto"); }
}
async function cleanOldAvatars(keep){
  try {
    const { data } = await sb.storage.from("avatars").list(user.id);
    const old = (data || []).map(o => `${user.id}/${o.name}`).filter(x => x !== keep);
    if (old.length) await sb.storage.from("avatars").remove(old);
  } catch (e) {}
}
async function removeAvatar(){
  const { error } = await sb.rpc("update_my_profile", {p_avatar:""});
  if (error) return toast(error.message);
  me.avatar = ""; delete PFC[user.id]; cleanOldAvatars("");
  const dn = $("#pf_n")?.value, db = $("#pf_b")?.value; render(); if ($("#pf_n") && dn != null) $("#pf_n").value = dn; if ($("#pf_b") && db != null) $("#pf_b").value = db;
  toast("Foto removida");

  const owned = myOrders.map(o => products.find(p => p.id === o.product_id)).filter(Boolean);
  if (!owned.length) return [];
  const catN = {}; owned.forEach(p => catN[p.category] = (catN[p.category] || 0) + 1);
  const avgP = owned.reduce((s, p) => s + Number(p.price), 0) / owned.length;
  const wd = t => norm(t).split(/[^a-z0-9]+/).filter(w => w.length > 3);
  const words = new Set(owned.flatMap(p => wd(p.title)));
  return products.filter(p => p.status === "available" && p.stock > 0 && !p.featured && !bought.has(p.id)).map(p => {
    const shared = wd(p.title).filter(w => words.has(w)).length, r = rating(p.id), pr = Number(p.price);
    const close = 1 - Math.abs(pr - avgP) / Math.max(pr, avgP, 1);
    return {p, match: !!catN[p.category] || shared > 0, sc: (catN[p.category] || 0) * 3 + shared * 2 + (r ? r.avg * 0.5 : 0) + close * 1.5};
  }).filter(x => x.match).sort((a, b) => b.sc - a.sc).slice(0, 6).map(x => x.p);
}

async function saveProduct(id){
  const btn = $("#savebtn"); btn.disabled = true; btn.textContent = "Salvando...";
  const fail = t => { $("#msg").textContent = t; toast(t); btn.disabled = false; btn.textContent = "Salvar"; };
  try {
    const row = { title:$("#f_t").value.trim(), description:$("#f_d").value, price:parseFloat(String($("#f_p").value).replace(",", ".")), old_price:$("#f_o").value ? parseFloat(String($("#f_o").value).replace(",", ".")) : null, status:$("#f_s").value, category:$("#f_c").value, stock:Math.max(0, parseInt($("#f_q").value) || 0), featured:$("#f_f").checked };
    { const fxv = $("#f_fx")?.value || ""; if (fxv || products.some(x => "fx" in x)) row.fx = fxv || null; }
    if (!row.title || !row.price) return fail("Preencha o título e o preço.");
    if (row.stock < 1 && row.status === "available") row.status = "sold";
    let merge = null;
    if (!id){
      merge = products.find(x => norm(x.title) === norm(row.title) && x.category === row.category);
      if (merge && !confirm(`Já existe o anúncio "${merge.title}" com ${merge.stock} unidade(s).\n\nOK = somar ${row.stock} unidade(s) nele\nCancelar = criar um anúncio separado`)) merge = null;
    }

      el.style.setProperty("--rx", ((.5 - y) * 10).toFixed(2) + "deg");
      el.style.setProperty("--mx", (x * 100).toFixed(1) + "%"); el.style.setProperty("--my", (y * 100).toFixed(1) + "%");
      el.style.setProperty("--px", (x - .5).toFixed(3)); el.style.setProperty("--py", (y - .5).toFixed(3));
    });
  };
  const reset = el => { ["--rx","--ry","--px","--py"].forEach(k => el.style.setProperty(k, "0")); el.classList.remove("hot"); };
  document.addEventListener("pointermove", e => {

let CART = [], CCODE = "", CQ = null;
try { CART = JSON.parse(localStorage.getItem("olipe_cart") || "[]").filter(x => x && x.id && x.q > 0); } catch (e) {}
const cok = p => !!p && p.status === "available" && p.stock > 0;
const cmax = p => Math.max(1, Math.min(p.stock || 1, 10));
const cartCount = () => CART.reduce((s, x) => s + x.q, 0);
const cartItems = () => CART.map(l => ({id:l.id, qty:l.q}));
function csave(){ try { localStorage.setItem("olipe_cart", JSON.stringify(CART)); } catch (e) {} bagBtn(); if ($("#cdr")?.classList.contains("open")){ cartRender(); if (CART.length) cartQuote(); } }
function cartClean(){
  const n = CART.length;
  CART = CART.filter(l => { const p = products.find(x => x.id === l.id); if (!cok(p)) return false; l.q = Math.min(l.q, cmax(p)); return true; });
  if (CART.length !== n) toast("Alguns itens saíram da sacola: não estão mais disponíveis.");
  try { localStorage.setItem("olipe_cart", JSON.stringify(CART)); } catch (e) {} bagBtn();
}
function cartAdd(id){
  const p = products.find(x => x.id === id); if (!cok(p)) return toast("Este item não está disponível.");
  const l = CART.find(x => x.id === id);
  if (l){ if (l.q >= cmax(p)) return toast("Você já colocou todas as unidades disponíveis."); l.q++; } else CART.push({id, q:1});
  csave(); const b = $("#bagb"); if (b){ b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); } toast("🛍 Adicionado à sacola");
}
function cartSet(id, d){ const l = CART.find(x => x.id === id), p = products.find(x => x.id === id); if (!l || !p) return; l.q = Math.min(l.q + d, cmax(p)); if (l.q < 1) CART = CART.filter(x => x !== l); csave(); }
function cartRm(id){ CART = CART.filter(x => x.id !== id); csave(); }
function bagBtn(){
  const nav = $("#nav"); if (!nav) return; let b = $("#bagb"); const n = cartCount();
  if (!b){ b = document.createElement("button"); b.id = "bagb"; b.className = "menu-btn"; b.setAttribute("aria-label", "Abrir sacola"); b.onclick = openCart; const mb = $("#mb"); mb ? nav.insertBefore(b, mb) : nav.append(b); }

}
function openCart(){

}
function closeCart(){ $("#cdr")?.classList.remove("open"); }
function cartRender(){
  const d = $("#cdr"); if (!d) return;

async function cartQuote(manual){

    if (has("receb", "entrega", "entregue", "chega", "onde vejo", "dados da conta")) return "Depois que a equipe confirma o pagamento, a entrega é feita e os dados da conta aparecem em **Meus pedidos**. Qualquer dúvida, fale com a equipe no chat do pedido.";
    if (has("prazo", "30 min", "expira", "cancelad", "tempo para pagar")) return "Depois de criar o pedido você tem **30 minutos** para pagar por Pix e enviar o comprovante no chat do pedido. Sem pagamento ou comprovante nesse prazo, o pedido é cancelado automaticamente.";
    if (has("pix", "pago", "pagar", "pagamento", "comprar", "como compro", "como faco")) return `Para comprar: entre na conta, abra o produto, aplique um cupom (opcional) e clique em **Comprar**. Pague por Pix na chave **${CONFIG.PIX_KEY}** (nome: ${CONFIG.PIX_NAME}) e envie o comprovante no chat do pedido. A equipe confirma e entrega.`;
    if (has("player", "jogador", "missao", "pvp", "leviata", "amigo")) return "Na aba **Encontre Players** do menu tem um chat aberto para achar gente para missões, PvP e Leviatã. Não é permitido passar senha, links ou contatos.";
    if (has("reembols", "estorno", "golpe", "erro", "bug", "problema", "nao chegou", "nao recebi", "travou")) return "Sinto muito por isso! Esse caso precisa da nossa equipe. Mande detalhes curtos (o que você clicou e o que apareceu) no chat do pedido ou no WhatsApp: " + WA();
    // procura produto pelo nome
    const words = n.split(/[^a-z0-9]+/).filter(w => w.length > 2);
    if (words.length){
      const found = list.map(p => ({p, sc: words.filter(w => norm(p.title).includes(w) || norm(p.category).includes(w)).length})).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, 4);
      if (found.length) return "Encontrei isto na loja:\n" + found.map(x => `• **${String(x.p.title).slice(0, 60)}**: ${brl(x.p.price)} (estoque: ${x.p.stock})`).join("\n") + "\nÉ só abrir o produto para comprar ou colocar na sacola.";
    }
    if (has("produto", "preco", "quanto", "valor", "tem ", "estoque", "disponivel") && list.length) return "Alguns produtos disponíveis agora:\n" + list.slice(0, 4).map(p => `• **${String(p.title).slice(0, 60)}**: ${brl(p.price)}`).join("\n") + "\nVeja todos na aba de produtos da loja.";
    return "Não tenho essa informação com certeza. Chame a nossa equipe no WhatsApp que eles te ajudam: " + WA();
  };
  const gap = (q, r) => { try { sb.from("support_gaps").insert({question:String(q).slice(0, 400), reason:r}).then(() => {}, () => {}); } catch (e) {} };
  const send = async txt => {
    txt = (txt || "").trim(); if (!txt || busy) return;
    if (Date.now() - lastT < 1800) return; lastT = Date.now();
    if (++nMsg > 30){ add("Chegamos ao limite desta conversa. Fale com a equipe: " + WA()); return; }
    add(txt, "me"); $i.value = ""; hist.push({role:"user", content:txt}); if (hist.length > 20) hist.splice(0, hist.length - 20);
    if (!KEY_OK()){ add("Ainda estou sendo configurada. Por enquanto, chame a equipe no WhatsApp: " + WA()); return; }
    if (aiDown){ add(localAnswer(txt)); humanBtn(txt); return; }
    busy = true; const t = add("", "typ");
    try {
      let r = await call(model);
      if (!r.ok && [400, 404].includes(r.status) && model !== FALLBACK){ model = FALLBACK; r = await call(model); }
      if (!r.ok){ let d = ""; try { d = (await r.text()).slice(0, 300); } catch (_) {} console.error("[Suporte] função respondeu", r.status, d); const er = new Error(r.status); er.code = r.status; throw er; }
      const j = await r.json(), a = (j.choices?.[0]?.message?.content || "").trim();
      t.remove(); if (!a) throw new Error("vazio");
      hist.push({role:"assistant", content:a}); add(a);
      if (/n[aã]o (tenho|sei|encontr).{0,40}(informa|certeza)/i.test(a)) gap(txt, "sem resposta");
      humanBtn(txt);
    } catch (e) { console.error("[Suporte] IA indisponível, usando respostas da loja", e); t.remove(); aiDown = true; add(localAnswer(txt)); humanBtn(txt); }
    finally { busy = false; }
  };
  document.getElementById("olai-s").onclick = () => send($i.value);
  $i.addEventListener("keydown", e => { if (e.key === "Enter") send($i.value); });
  document.querySelectorAll(".olai-q button").forEach(b => b.onclick = () => send(b.textContent));
  setTimeout(() => $b.classList.remove("pulse"), 6000);
})();
</script>
